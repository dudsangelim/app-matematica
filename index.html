<style>
/* Fonts are served from this site (no third-party requests). */
@font-face{font-family:'Fredoka';font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Andika';font-weight:400;font-display:swap;src:url(fonts/andika-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Andika';font-weight:700;font-display:swap;src:url(fonts/andika-latin-700-normal.woff2) format('woff2')}
/* Layout: full-screen 3D. A central city with portals to 8 themed worlds; every exercise is played with the avatar. HUD floats on top. Single bright game look. */
:root{
  --ink:#1B2232; --paper:#FFFFFF;
  --glass:rgba(16,22,36,.62); --go:#22B35E; --gold:#FFC83D; --red:#E53935; --muted:#5B6475;
  --ok:#22A55A; --okbg:#DDF6E6; --badbg:#FFE3E0;
  --fd:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --fb:'Andika','Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#8FD3FF;color:var(--ink);font-family:var(--fd);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body.caps{text-transform:uppercase}
body.caps input{text-transform:none}
button,select{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;text-transform:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
input{user-select:text;-webkit-user-select:text}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 56%,rgba(8,18,44,.2) 100%)}
#touch{position:fixed;inset:0;z-index:1;touch-action:none}
.hud-top{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap}
.hud-top>*{pointer-events:auto}
button.chip{border:0;font-family:inherit;cursor:pointer}
.chip{background:var(--glass);color:#fff;border-radius:12px;padding:7px 11px;font-weight:600;font-size:18px;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2)}}
.sp{flex:1}
.hbtn{width:46px;height:46px;border-radius:12px;background:var(--glass);border:0;color:#fff;font-size:22px;display:grid;place-items:center;padding:0;position:relative}
.hbtn.off{opacity:.55}
.hbtn.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;background:#FF5F57;transform:rotate(-40deg);border-radius:2px}
#where{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);color:#fff;border-radius:10px;padding:4px 12px;font-size:14px;font-weight:600;white-space:nowrap}
#mission{position:fixed;z-index:5;top:calc(var(--hudh,56px) + 8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:6px 6px 6px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;line-height:1.25;box-shadow:0 5px 0 var(--ink)}
#mission b{color:var(--red)}
.pc{display:inline-block;background:var(--k);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 7px;font-weight:700;text-shadow:1px 0 0 var(--ink),-1px 0 0 var(--ink),0 1px 0 var(--ink),0 -1px 0 var(--ink)}
#mission .vt{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;margin-right:4px;font-size:15px;vertical-align:2px}
#mission small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
#m-text{cursor:pointer}
/* folded: only the action tag, the question counter and, in timed games, the clock and hearts stay on screen */
#mission.min{padding:3px 3px 3px 8px;gap:5px;border-width:3px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
#mission.min #m-text{font-size:0;line-height:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0}
#mission.min #m-text .vt,#mission.min #m-text .cnt,#mission.min #m-text small.live{white-space:nowrap}
#mission.min #m-text>*{display:none}
#mission.min #m-text .vt{display:inline-block;font-size:13px;line-height:1.4;margin:0;vertical-align:0}
#mission.min #m-text .cnt{display:inline;font-size:15px;line-height:1.4}
#mission.min #m-text small.live{display:block;font-size:14px;line-height:1.4;color:var(--ink);font-weight:600}
/* steps of an order of the master: done, current, still to come */
.stp{display:inline-block;padding:0 6px;border-radius:8px;margin:1px 0;border:2px solid transparent}
.stp.cur{background:var(--gold);border-color:var(--ink)}
.stp.done{color:var(--ok)}
.stp.todo{color:var(--muted)}
#mission .stp small{display:inline;font-size:inherit;color:inherit;font-weight:700}
#mission.min #m-text .stp.cur{display:inline-block;font-size:14px;line-height:1.4;white-space:nowrap}
@media (max-height:520px){#mission:not(.min) .stp.done{display:none}.stp{font-size:15px}}
#mission .rs{display:none}
#mission.min .rd{display:none}
#mission.min .rs{display:inline}
#mission.min .mb{width:38px;height:38px;font-size:16px;border-width:2px;border-radius:9px}
#mission .mb{width:40px;height:40px;flex:none;border-radius:10px;border:3px solid var(--ink);background:var(--gold);display:grid;place-items:center;padding:0;font-size:18px}
#mission .mb.q{background:#fff}
.hud-br{position:fixed;z-index:5;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.hud-row{display:flex;align-items:flex-end;gap:10px}
.rot{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.82);border:4px solid var(--ink);font-size:26px;font-weight:700;box-shadow:0 4px 0 var(--ink);padding:0;touch-action:none}
.rot.on{background:var(--gold);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#b-jump,#b-fire{width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.9);border:4px solid var(--ink);font-size:38px;font-weight:700;box-shadow:0 5px 0 var(--ink);padding:0;touch-action:none}
#b-fire{background:#FF6B5E}
/* crosshair of the balloon game: what is under it gets hit */
/* the scope of the balloon game: dark outside the glass, a cross in the middle, gold when a balloon is under it */
#scope{position:fixed;inset:0;z-index:3;pointer-events:none;--r:min(37vh,38vw);background:radial-gradient(circle var(--r) at 50% 57%,transparent 0,transparent 97%,rgba(6,10,20,.93) 100%)}
#scope i{position:absolute;left:50%;top:57%;width:calc(var(--r)*2);height:calc(var(--r)*2);margin:calc(var(--r)*-1) 0 0 calc(var(--r)*-1);border-radius:50%;box-sizing:border-box;border:6px solid var(--ink);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),inset 0 0 70px rgba(6,10,20,.5)}
#scope i::before,#scope i::after{content:"";position:absolute;background:rgba(20,26,40,.8)}
#scope i::before{left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px}
#scope i::after{top:50%;left:0;right:0;height:3px;margin-top:-1.5px}
#scope b{position:absolute;left:50%;top:57%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #E53935;box-sizing:border-box}
#scope.on i{border-color:var(--gold)}
#scope.on b{border-color:var(--gold);background:rgba(255,200,61,.55)}
#scope.miss i{animation:scopemiss .5s}
@keyframes scopemiss{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),inset 0 0 70px rgba(6,10,20,.5)}30%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),inset 0 0 90px rgba(229,57,53,.85)}}
body.fp #b-jump,body.fp .rot,body.fp #where{display:none}
.zrow{display:none;position:fixed;z-index:5;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));gap:10px}
body.fix .zrow{display:flex}
.zm{font-size:34px;line-height:1}
body.still #b-jump,body.still #b-cele,body.still #where,body.still #joy{display:none}
@media(max-width:620px){body.still .hud-br,body.fix .zrow{bottom:calc(112px + env(safe-area-inset-bottom,0px))}}
#board{position:fixed;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(10,16,32,.28))}
#board canvas{display:block;width:100%;height:auto}
#board.wide{left:calc(10px + env(safe-area-inset-left,0px));width:min(47vw,620px)}
#board.tall{left:50%;transform:translateX(-50%);width:min(94vw,560px,max(220px,calc((100vh - 420px)*2.5)))}
#board.count{right:calc(12px + env(safe-area-inset-right,0px));width:clamp(120px,17vw,200px)}
body.still #toast:not(.up){bottom:calc(116px + env(safe-area-inset-bottom,0px))}
#picks{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:14px}
.pk{min-width:96px;height:80px;padding:0 14px;border-radius:22px;border:4px solid var(--ink);color:#fff;font:inherit;font-weight:700;font-size:42px;line-height:1;box-shadow:0 6px 0 var(--ink);touch-action:manipulation}
.pk0{background:#E8413A}.pk1{background:#2E8BF0}.pk2{background:#8B4CF0}.pk3{background:#FF8A1F}.pk4{background:#12A5A0}
.pk:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pk.no{background:#9AA3B2;color:#E9EDF3;text-decoration:line-through;box-shadow:0 3px 0 var(--ink);transform:translateY(3px)}
.pk.ok{background:#22B35E;box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--gold)}
@media(max-height:430px){body.fix .zrow,body.still .hud-br{bottom:calc(14px + env(safe-area-inset-bottom,0px))}body.fix .rot{width:50px;height:50px}body.still #toast:not(.up){bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:16px;padding:8px 14px}#picks{bottom:calc(10px + env(safe-area-inset-bottom,0px))}.pk{min-width:84px;height:60px;font-size:34px;border-radius:18px}}
@media(max-width:380px){#picks{gap:10px}.pk{min-width:86px}}
body.fp #toast{pointer-events:none;font-size:17px;padding:8px 14px}
#b-jump:active,#b-fire:active,#b-act:active,#b-sure:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#b-sure{padding:13px 18px;border-radius:16px;background:var(--gold);border:4px solid var(--ink);font-weight:700;font-size:20px;box-shadow:0 5px 0 var(--ink)}
#b-act{padding:13px 18px;border-radius:16px;background:var(--go);color:#fff;border:4px solid var(--ink);font-weight:700;font-size:20px;box-shadow:0 5px 0 var(--ink);animation:pulse 1.2s infinite;max-width:60vw}
@keyframes pulse{50%{transform:scale(1.06)}}
#joy{position:fixed;z-index:4;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.7);pointer-events:none;box-sizing:border-box}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink)}
#toast{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(230px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:19px;max-width:calc(100% - 40px);text-align:center;line-height:1.3}
#toast b{color:var(--gold)}
#toast.up{z-index:12;bottom:auto;top:calc(var(--hudh,56px) + 14px + env(safe-area-inset-top,0px))}
#fade{position:fixed;inset:0;z-index:20;background:#0B1020;opacity:0;pointer-events:none;transition:opacity .35s;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700}
#fade.on{opacity:1}
#ov{position:fixed;inset:0;z-index:10;background:rgba(10,16,30,.5);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
#ov.bottom{align-items:flex-end;background:linear-gradient(transparent 40%,rgba(10,16,30,.35))}
.sheet{width:100%;max-width:660px;max-height:100%;overflow-y:auto;overflow-x:hidden;background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);box-sizing:border-box;-webkit-overflow-scrolling:touch}
#ov.bottom .sheet{max-height:58%}
.pad{padding:18px}
.btn{border:4px solid var(--ink);border-radius:14px;background:#fff;padding:12px 18px;font-weight:700;font-size:19px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--go);color:#fff}
.btn.gold{background:var(--gold)}
.btn.icon{padding:12px 14px}
.btn.big{font-size:26px;min-width:90px}
.btn:disabled{opacity:.45;box-shadow:0 2px 0 var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.h2{font-weight:700;font-size:26px;margin:0 0 8px}
.small{font-size:15px;color:var(--muted)}
.xbtn{width:42px;height:42px;border-radius:10px;border:3px solid var(--ink);background:#fff;font-size:18px;padding:0;flex:none}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg-name{align-self:flex-start;background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:700;font-size:20px;-webkit-text-stroke:.5px var(--ink)}
.dlg p{margin:0;font-family:var(--fb);font-size:21px;line-height:1.4}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{display:flex;gap:10px;align-items:center;text-align:left;border:4px solid var(--ink);border-radius:16px;background:var(--c);color:#fff;padding:12px;box-shadow:0 4px 0 var(--ink)}
.mode .mi{font-size:34px;line-height:1;background:#fff;border-radius:12px;width:52px;height:52px;display:grid;place-items:center;flex:none;border:3px solid var(--ink)}
.mode b{display:block;font-size:20px;-webkit-text-stroke:.4px var(--ink)}
.mode small{display:block;font-size:14px;font-weight:500;opacity:.95}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.result{padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result h2{margin:0;font-weight:700;font-size:34px}
.bigstars{font-size:54px;letter-spacing:6px}
.bigstars .off{filter:grayscale(1);opacity:.3}
.result p{margin:0;font-family:var(--fb);font-size:20px}
.pillmsg{background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:6px 14px;font-weight:700;font-size:19px}
.award{display:flex;flex-direction:column;align-items:center;gap:6px;background:#1B2232;color:#FFE27A;border-radius:16px;padding:12px 18px;border:4px solid #FFC83D}
.award b{font-size:22px}
.award canvas{width:130px;height:130px}
.award small{color:#fff;opacity:.9;font-size:14px;text-align:center}
.award span{text-align:center}
.shop-h{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.shop-h .h2{margin:0;flex:1}
.pass{margin:2px 14px 8px;padding:8px 12px;border:3px solid var(--ink);border-radius:12px;font-family:var(--fb);font-size:17px;line-height:1.3;background:var(--okbg)}
.pass.off{background:var(--badbg)}
.items.shut .item:not(.eq){opacity:.55}
.quiz .sum{font-size:34px;font-family:var(--fd,inherit);letter-spacing:1px}
.quiz p.small{font-size:17px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px}
.mhow{margin:0;font-family:var(--fb);font-size:18px;line-height:1.35}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 10px}
.mrow.done{background:var(--okbg)}
.mrow .mn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.mrow.done .mn{background:var(--ok)}
.mrow .mt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:18px}
.mrow .mt small{font-family:var(--fb);font-size:14px;color:var(--muted);font-weight:500}
.mrow .btn{padding:8px 14px;font-size:17px}
.ck{display:flex;gap:10px;align-items:flex-start;font-family:var(--fb);font-size:16px;line-height:1.4;margin:8px 0}
.ck input{flex:none;width:24px;height:24px;margin-top:2px}
.rep .tips{margin:0;padding-left:22px;font-family:var(--fb);font-size:17px;line-height:1.45}
.rep .tips li{margin:4px 0}
.rep .rp{margin:0 0 8px;font-family:var(--fb);font-size:17px;line-height:1.45}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border:2px solid #C9CED6;border-radius:10px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;font-size:13px;color:var(--muted);min-height:58px}
.wd.on{border-color:var(--ink);background:var(--okbg);color:var(--ink)}
.wd b{font-size:14px}
.rep td,.rep th{white-space:normal}
.rep td:first-child{min-width:140px}
.rep .stp2{display:block;font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hist{white-space:nowrap!important;line-height:1}
.hist i{display:inline-block;width:8px;height:8px;border-radius:50%;border:2px solid var(--ink);margin-right:1px;box-sizing:border-box}
.hist i.y{background:var(--ok);border-color:var(--ok)}
.errs{display:flex;flex-wrap:wrap;gap:6px}
.errs span{border:2px solid var(--ink);border-radius:10px;padding:3px 9px;font-family:var(--fb);font-size:15px;background:#fff}
.errs .bad{color:#B3261E}
.tab{flex:none;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:7px 12px;font-weight:600;font-size:16px}
.tab.on{background:var(--gold)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;padding:0 14px 16px}
.item{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:600;text-align:center;box-shadow:0 3px 0 var(--ink)}
.item.eq{background:var(--okbg)}
.item .pv{font-size:40px;height:48px;display:grid;place-items:center;line-height:1}
.jr{width:52px;height:52px;display:block}
.sw{display:block;width:44px;height:44px;border:3px solid var(--ink);border-radius:8px;background:var(--k);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18)}
.st{font-size:15px;padding:2px 10px;border-radius:8px;border:2px solid var(--ink);background:#fff}
.item.eq .st{background:var(--ok);color:#fff}
.st.price{background:var(--gold)}
.item.poor .st.price{background:#eee;color:var(--muted)}
.item small{font-weight:500;color:var(--muted);font-size:13px}
.quiz{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.quiz p{margin:0;font-family:var(--fb);font-size:22px;line-height:1.4}
.quiz .fb{min-height:28px;font-family:var(--fb);font-size:18px;color:#B3261E}
.menu{padding:16px;display:flex;flex-direction:column;gap:10px}
.travel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.travel button{border:3px solid var(--ink);border-radius:12px;background:var(--c);padding:10px;text-align:left;font-weight:600;font-size:16px;line-height:1.15;color:#fff;-webkit-text-stroke:.3px var(--ink)}
.travel small{display:block;font-weight:500;font-size:13px;-webkit-text-stroke:0;opacity:.95}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px;font-family:var(--fb)}
th,td{padding:8px 6px;border-bottom:2px solid #E3E7EF;text-align:left;white-space:nowrap}
th{font-family:var(--fd);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field input{font:inherit;font-size:20px;padding:10px 12px;border:3px solid var(--ink);border-radius:10px;width:150px;min-width:0}
.tut{display:grid;grid-template-columns:56px 1fr;gap:10px 12px;align-items:center;font-family:var(--fb);font-size:19px;line-height:1.3;margin:10px 0 16px}
.tut .i{font-size:32px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cf{position:fixed;top:-20px;width:12px;height:12px;border:2px solid rgba(0,0,0,.4);z-index:30;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:20px;background:#8FD3FF;z-index:50}
.sec{font-weight:700;font-size:19px;margin:16px 0 4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.players button{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:10px;text-align:left;font-weight:600;font-size:17px}
.players button.on{background:var(--okbg)}
.players small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
select{font-size:17px;padding:8px;border:3px solid var(--ink);border-radius:10px;background:#fff}
@media (max-width:520px){#where{display:none}.chip{font-size:15px;padding:6px 8px}.hbtn{width:42px;height:42px;font-size:20px}}
@media (max-height:520px){#toast{bottom:calc(112px + env(safe-area-inset-bottom,0px));max-width:56%;font-size:16px;padding:8px 14px}#mission{font-size:16px;border-width:3px;box-shadow:0 3px 0 var(--ink)}#mission small{font-size:12px}
  .quiz{padding:10px 12px;gap:7px}.quiz p{font-size:18px;line-height:1.25}.quiz p.small{font-size:15px}.quiz .h2{font-size:21px;margin:0}.quiz .btn.big{font-size:22px;min-width:74px;padding:8px 12px}.quiz .sum{font-size:28px}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.shake,#b-act,.chip.bump{animation:none}#fade{transition:none}}
</style>

<body>

<div id="vig"></div>
<div id="touch"></div>
<div id="joy"><div id="knob"></div></div>
<header class="hud-top">
  <div class="chip" id="h-name">Jogador</div>
  <div class="chip" id="h-c"><span>🪙</span><b id="h-coins">0</b></div>
  <div class="chip" id="h-s"><span>⭐</span><b id="h-stars">0</b></div>

<div id="where">Cidade dos Números</div>
<div id="picks" hidden></div>
<div id="board" hidden></div>
<div class="zrow">
  <button class="rot zm" id="b-zo" aria-label="Afastar a câmera">−</button>
  <button class="rot zm" id="b-zi" aria-label="Aproximar a câmera">+</button>
</div>
<div class="hud-br">
  <button id="b-act" hidden></button>
  <button id="b-sure" hidden></button>
  <button id="b-fire" hidden aria-label="Atirar">🎯</button>
  <button class="rot" id="b-cele" aria-label="Escolher a comemoração">🎉</button>
  <div class="hud-row">
    <button class="rot" id="b-rl" aria-label="Girar câmera para a esquerda">⟲</button>
    <button class="rot" id="b-rr" aria-label="Girar câmera para a direita">⟳</button>

  </div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const setEq=(s,t)=>s.length===t.length&&t.every(i=>s.includes(i));
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ================= SAVE ================= */
/* One save per player profile. Profile 0 keeps the original key, so older saves keep working. */
const KEY0='ilha-numeros-3d-v1',PKEY='ilha-numeros-perfis',MAXP=6;
let PF=null;
try{PF=JSON.parse(localStorage.getItem(PKEY))}catch(e){}
if(!PF||!Array.isArray(PF.ids)||!PF.ids.length)PF={cur:0,ids:[0],next:1};
if(!PF.ids.includes(PF.cur))PF.cur=PF.ids[0];
const keyOf=id=>id?KEY0+'-p'+id:KEY0,KEY=keyOf(PF.cur);
function savePF(){try{localStorage.setItem(PKEY,JSON.stringify(PF))}catch(e){}}
function readSave(id){try{return JSON.parse(localStorage.getItem(keyOf(id)))}catch(e){return null}}
/* Goal celebrations, in the order they are unlocked: one more with every new best medal (and with the champions cup).
   d = seconds, f = face, e = picture in the list. */
const CELES=[{k:'siu',n:'Siuuu!',who:'Cristiano Ronaldo',e:'🚀',d:3.2,f:'wow'},{k:'ceu',n:'Dedos para o céu',who:'Messi',e:'☝️',d:3,f:'happy'},{k:'cruzado',n:'Braços cruzados',who:'Mbappé',e:'😎',d:3,f:'cool'},
  {k:'zen',n:'Meditação',who:'Haaland',e:'🧘',d:3.4,f:'zen'},{k:'samba',n:'Sambinha',who:'Vinícius Júnior',e:'💃',d:3.4,f:'wow'},{k:'hang',n:'Dancinha do hang loose',who:'Neymar',e:'🤙',d:3.2,f:'tongue'},
  {k:'abertos',n:'Braços abertos',who:'Bellingham',e:'🙆',d:3,f:'happy'},{k:'arvore',n:'Pose da árvore',who:'Salah',e:'🌳',d:3.2,f:'zen'},{k:'frio',n:'Que frio!',who:'Cole Palmer',e:'🥶',d:3,f:'cool'},
  {k:'mascara',n:'Máscara',who:'Gyökeres',e:'🎭',d:3,f:'cool'}];
const celeOf=k=>CELES.find(c=>c.k===k)||null;
const DEF={name:'',coins:0,stars:0,sound:true,music:true,voice:true,caps:false,breakMin:0,tut:false,look:{skin:'s2',hair:'castanho',shirt:'azul',pants:'jeans',hat:'nenhum',pet:'nenhum'},lite:false,misMin:false,edit:true,musStyle:'rock',celes:-1,cele:'',misOn:true,restOn:true,mis:{n:0,list:[]},rest:{},errs:[],days:{},owned:[],st:{},trophies:{},champ:false,sk:{},wk:{}};
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function normalize(raw){const s=Object.assign(JSON.parse(JSON.stringify(DEF)),isObj(raw)?raw:{}),oldTiers=isObj(raw)&&!(raw.v>=2);s.v=2;s.look=Object.assign({},DEF.look,isObj(s.look)?s.look:{});
  ['st','trophies','sk','wk'].forEach(k=>{if(!isObj(s[k]))s[k]={}});if(!Array.isArray(s.owned))s.owned=[];s.name=String(s.name||'').slice(0,14);s.coins=Math.max(0,Math.round(+s.coins)||0);s.stars=Math.max(0,Math.round(+s.stars)||0);s.breakMin=[0,15,20,30,45].includes(+s.breakMin)?+s.breakMin:0;
  const num=(o,ks)=>ks.forEach(k=>o[k]=Math.max(0,+o[k]||0));
  Object.keys(s.st).forEach(k=>{const t=s.st[k];if(!isObj(t))return delete s.st[k];num(t,['rounds','first','total','stars']);t.level=Math.min(3,Math.max(1,Math.round(+t.level)||1))});
  Object.keys(s.sk).forEach(k=>{const t=s.sk[k];if(!isObj(t))return delete s.sk[k];num(t,['n','f','r','w','d']);t.r=Math.min(1,t.r);t.h=String(t.h||'').replace(/[^01]/g,'').slice(-12)});
  Object.keys(s.wk).forEach(k=>{const w=s.wk[k];if(!/^\d{4}-\d\d-\d\d$/.test(k)||!isObj(w))return delete s.wk[k];Object.keys(w).forEach(i=>{if(!Array.isArray(w[i]))delete w[i];else w[i]=[+w[i][0]||0,+w[i][1]||0]})});
  Object.keys(s.trophies).forEach(k=>{let t=Math.min(4,Math.max(0,Math.round(+s.trophies[k])||0));if(oldTiers&&t===3)t=4;s.trophies[k]=t});s.owned=s.owned.filter(x=>typeof x==='string');s.edit=s.edit!==false;s.musStyle=s.musStyle==='calma'?'calma':'rock';
  /* a save from before the celebrations starts with one for each station that already has a medal */
  s.celes=s.celes>=0?Math.min(CELES.length,Math.round(+s.celes)||0):Math.min(CELES.length,Object.values(s.trophies).filter(v=>v>0).length+(s.champ?1:0));
  if(CELES.findIndex(c=>c.k===s.cele)<0||CELES.findIndex(c=>c.k===s.cele)>=s.celes)s.cele='';
  /* mission, rest, the last mistakes and the day log (which stations exist is checked when the mission is read: they are not known yet here) */
  s.misOn=s.misOn!==false;s.restOn=s.restOn!==false;if(!isObj(s.mis))s.mis={};s.mis.n=Math.max(0,Math.round(+s.mis.n)||0);
  s.mis.list=(Array.isArray(s.mis.list)?s.mis.list:[]).filter(isObj).slice(0,3).map(i=>({id:String(i.id||''),mi:Number.isInteger(i.mi)?i.mi:-1,done:!!i.done}));
  if(!isObj(s.rest))s.rest={};Object.keys(s.rest).forEach(k=>{const r=s.rest[k];if(!isObj(r)||!Array.isArray(r.need))delete s.rest[k];else r.need=r.need.filter(x=>typeof x==='string')});
  s.errs=(Array.isArray(s.errs)?s.errs:[]).filter(isObj).slice(-40).map(e=>({s:String(e.s||''),q:String(e.q||'').slice(0,40),r:+e.r||0,g:+e.g||0,d:+e.d||0}));
  if(!isObj(s.days))s.days={};Object.keys(s.days).forEach(k=>{const d=s.days[k];if(!/^\d{4}-\d\d-\d\d$/.test(k)||!isObj(d))return delete s.days[k];['t','q','f','r','m'].forEach(x=>d[x]=Math.max(0,+d[x]||0));if(!isObj(d.st))d.st={}});return s}
let S=normalize(readSave(PF.cur));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const stat=id=>S.st[id]||(S.st[id]={level:1,rounds:0,first:0,total:0,stars:0});
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
if(S.caps)document.body.classList.add('caps');
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

/* ================= SKILLS (what was practised, how it went, what to bring back) ================= */
/* Every question carries a skill id "station.type". For each skill the save keeps: n answers, f right at the first try,
   r a rolling score (recent answers weigh more), w how many clean answers are still owed after a miss, d last day played. */
const SKN={'vocab.cima':'Em cima e embaixo','vocab.dentro':'Dentro e fora','vocab.perto':'Perto e longe','vocab.tam':'Maior e menor (tamanho)','vocab.qtd':'Mais e menos (quantidade)','vocab.fila':'Ordem na fila: 1º, 2º, último','vocab.entre':'Entre','vocab.lado':'Direita e esquerda','vocab.frente':'Na frente e atrás','vocab.cmd1':'Mestre mandou: ordens de 1 passo','vocab.cmd2':'Mestre mandou: ordens de 2 passos','vocab.cmd3':'Mestre mandou: ordens de 3 passos','vocab.pegadinha':'Só obedecer quando o mestre mandou',
  'n10.pint':'Contar até 10','n10.compl':'Completar 10 pintando','n10.leve':'Contar e separar objetos','n10.enche':'Completar 10 no cesto','n10.cont':'Contar e achar o número','n10.grupo':'Achar o grupo com a quantidade','n10.depois':'Antes e depois até 10','n10.palavra':'Ler o nome dos números','n10.padrao':'Padrões que se repetem','n10.grafico':'Ler gráfico de colunas','n10.chance':'Certeza, talvez, impossível','n10.dividir':'Dividir igualmente (desafio extra)','n10.entregar':'Entregar a quantidade pedida',
  'dinheiro.qt':'Somar notas e moedas','dinheiro.pague':'Pagar o valor exato','dinheiro.vale':'Comparar quantias','dinheiro.leve':'Montar um valor no caixa','dinheiro.troco':'Calcular o troco','dinheiro.compre':'O que dá para comprar','dinheiro.trocado':'Dar dinheiro trocado',
  'n100.dez':'Dezenas e unidades','n100.viz':'Vizinhos: antes, depois, entre','n100.maior':'Comparar números até 100','n100.fam':'Famílias das dezenas','n100.monte':'Montar número com barras de 10','n100.quadro':'Quadro do 100','n100.seq':'Contar de 2 em 2, 5 em 5, 10 em 10','n100.conta':'Somar com dezenas',
  'medidas.comp':'Comprimento','medidas.altura':'Altura','medidas.peso':'Peso','medidas.capac':'Cheio e vazio','medidas.tempo':'Manhã e noite','medidas.semana':'Dias da semana','medidas.clipes':'Medir com clipes','medidas.esc1':'Escada: contar degraus','medidas.esc2':'Escada: a mais e a menos','medidas.esc3':'Escada: entre duas alturas','medidas.esc4':'Escada: somar degraus',
  'contas.juntar':'Juntar: quantos ficam quando chegam mais (ônibus, gols)','contas.tirar':'Tirar: quantos ficam quando saem (ônibus, gols anulados)','contas.falta':'Descobrir a parte que falta (quantos subiram, quantos gols faltam)','contas.comparar':'Comparar: quantos gols a mais','contas.retamais':'Somar pulando para a frente na reta','contas.retamenos':'Subtrair pulando para trás na reta',
  'contas.soma':'Adição (conta escrita)','contas.sub':'Subtração (conta escrita)','contas.decompor':'Jeitos de formar um número',
  'ordem.depois':'O número que vem depois','ordem.antes':'O número que vem antes','ordem.maior':'Achar um número maior','ordem.menor':'Achar um número menor','ordem.salto':'Contar pulando: 2, 5, 10','ordem.seq':'Sequência crescente','ordem.seqdec':'Sequência decrescente',
  'formas.tfig':'Figuras planas pelo nome','formas.tsol':'Sólidos pelo nome','formas.lados4':'Figuras de 4 lados','formas.lados3':'Figuras de 3 lados','formas.rolam':'Formas que rolam','formas.semcanto':'Figuras sem cantos'};
const skillName=id=>SKN[id]||'Reconhecer: '+id.split('.')[1];
const dayNum=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function weekKey(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)-7*(off||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let lastSkill=null;const prevPick={};
function tag(pre,t){lastSkill=pre+'.'+t;return t}
/* Chooses the next question type: half of the time one that was missed and is still owed; otherwise weaker and newer types weigh more. */
function pickSkill(pre,list){const prev=prevPick[pre],due=list.filter(t=>t!==prev&&(S.sk[pre+'.'+t]||{}).w>0);let t;
  if(due.length&&Math.random()<.5)t=pick(due);
  else{let c=list.filter(x=>x!==prev);if(!c.length)c=list;const w=c.map(x=>{const k=S.sk[pre+'.'+x];return k?1+(1-k.r)*1.5:1.6});let r=Math.random()*sum(w);t=c[c.length-1];for(let i=0;i<c.length;i++){r-=w[i];if(r<0){t=c[i];break}}}
  prevPick[pre]=t;return tag(pre,t)}
/* the last wrong answers, each with its question, the right answer and the one given: the report shows what kind of mistake comes back */
function noteErr(skill,q,r,g){S.errs.push({s:String(skill||''),q:String(q).slice(0,40),r:+r,g:+g,d:dayNum()});while(S.errs.length>40)S.errs.shift()}
function record(id,first,skill){const s=stat(id);s.total++;if(first)s.first++;
  if(skill){const k=S.sk[skill]||(S.sk[skill]={n:0,f:0,r:0,w:0,d:0,h:''});k.r=k.n?Math.round((k.r*.7+(first?.3:0))*1000)/1000:first?1:0;k.n++;if(first){k.f++;if(k.w>0)k.w--}else k.w=2;k.d=dayNum();k.h=((k.h||'')+(first?'1':'0')).slice(-12)}
  const dy=DAY();dy.q++;if(first)dy.f++;flushTime();
  const wk=weekKey(),W=S.wk[wk]||(S.wk[wk]={}),a=W[id]||(W[id]=[0,0]);a[1]++;if(first)a[0]++;
  const ks=Object.keys(S.wk).sort();while(ks.length>12)delete S.wk[ks.shift()];save()}

/* ================= SOUND ================= */
let actx=null,sfxBus=null,musBus=null,noiseBuf=null;const MUSVOL=.3;
function ensureAudio(){if(actx){if(actx.state==='suspended'&&!document.hidden)actx.resume();return}
  try{actx=new (window.AudioContext||window.webkitAudioContext)();sfxBus=actx.createGain();sfxBus.connect(actx.destination);musBus=actx.createGain();musBus.gain.value=S.music?MUSVOL:0;musBus.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;try{startAmb()}catch(e){ambBus=ambSea=null}startMusic();if(siuData)decodeSiu(siuData).then(b=>{siuBuf=b},()=>{})}catch(e){actx=null}}
document.addEventListener('pointerdown',()=>{ensureAudio();unlockSpeech()},true);
document.addEventListener('keydown',()=>{ensureAudio();unlockSpeech()},true);
/* silence everything while the page is in the background */
document.addEventListener('visibilitychange',()=>{try{if(document.hidden){if(actx)actx.suspend();if(window.speechSynthesis)speechSynthesis.cancel()}else if(actx)actx.resume()}catch(e){}});
function tone(f,d,type,vol,when,f2){if(!S.sound||!actx)return;try{
  const t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(sfxBus);o.start(t);o.stop(t+d+.02)}catch(e){}}
function hiss(d,vol,when,hp){if(!S.sound||!actx)return;try{const t=actx.currentTime+(when||0),n=actx.createBufferSource();n.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||2000;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(f).connect(g).connect(sfxBus);n.start(t,Math.random()*.5);n.stop(t+d+.02)}catch(e){}}
/* --- background music: procedural light rock, one song per world --- */
const SONGS={hub:{bpm:112,key:43,prog:[0,7,9,5],feel:'rock',seed:1},contas:{bpm:136,key:40,prog:[0,5,7,5],feel:'surf',seed:2},ordem:{bpm:128,key:45,prog:[0,0,5,7],feel:'drive',seed:3},
  vocab:{bpm:98,key:48,prog:[0,9,5,7],feel:'soft',seed:4},n10:{bpm:114,key:43,prog:[0,5,0,7],feel:'country',seed:5},formas:{bpm:118,key:50,prog:[0,10,5,7],feel:'rock',seed:6},
  dinheiro:{bpm:104,key:45,prog:[0,5,9,7],feel:'soft',seed:7},n100:{bpm:124,key:47,prog:[0,9,5,7],feel:'drive',seed:8},medidas:{bpm:108,key:41,prog:[0,7,9,5],feel:'rock',seed:9}};

/* --- narration (text-to-speech) --- */
/* Every character has a voice of their own. The game can only use the voices the device has, so it does two things:
   - each character gets a pitch (p) and a pace (r) of their own, which is all that changes when the device has a single Portuguese voice;
   - when there are several, they are dealt out so that men get a man's voice, women a woman's, and no two characters share one while there are enough.
   The characters are listed from the deepest voice to the highest. The hosts read the questions, so their pitch stops short of the extremes. */
const VOICES={'Seu Zé':{p:.5,r:.82,g:'m'},Mestre:{p:.6,r:.8,g:'m'},Lojista:{p:.8,r:.95,g:'m'},Theo:{p:.9,r:.9,g:'m'},Pedro:{p:1,r:1.02,g:'m'},Rafa:{p:1.15,r:.95,g:'m'},'Léo':{p:1.25,r:.9,g:'m'},Juca:{p:1.35,r:1,g:'m'},

/* names of the Portuguese voices of the common systems (Windows and Edge, Apple, Android), to tell a man's voice from a woman's */
const FEM=/luciana|maria|francisca|fernanda|vit[oó]ria|camila|joana|let[ií]cia|thalita|brenda|elza|giovanna|leila|manuela|yara|catarina|in[eê]s|raquel|helo[ií]sa|\bflo\b|sandy|shelley|grandma|female|feminin|mulher/i;
const MASC=/felipe|daniel|ant[oô]nio|ricardo|donato|f[aá]bio|humberto|j[uú]lio|nicolau|val[eé]rio|duarte|cristiano|eddy|\breed\b|rocko|grandpa|\bmale|masculin|homem/i;
let ptVoice=null,ptVoices=[],voiceMap={},speechOK=false;
function pickVoice(){try{const vs=speechSynthesis.getVoices();ptVoices=vs.filter(v=>/pt[-_]BR/i.test(v.lang));if(!ptVoices.length)ptVoices=vs.filter(v=>/^pt/i.test(v.lang));ptVoice=ptVoices[0]||null;castVoices()}catch(e){}}
/* deal the voices of the device out to the characters */
function castVoices(){voiceMap={};if(ptVoices.length<2)return;
  /* the Google voices of desktop Chrome ignore the pitch: they are kept for the narrator when the device has any other */
  const rest=ptVoices.filter(v=>!/^google/i.test(v.name)),pool=rest.length?rest:ptVoices,men=pool.filter(v=>MASC.test(v.name)&&!FEM.test(v.name)),women=pool.filter(v=>FEM.test(v.name)),other=pool.filter(v=>!men.includes(v)&&!women.includes(v)),uses=new Map();
  /* each character takes the least used of the voices that suit them (their own kind first, then the ones of unknown kind),
     so no voice is used twice while another one is still free - also when both groups draw from the same unknown voices */
  const take=list=>{let best=list[0];for(const v of list)if((uses.get(v)||0)<(uses.get(best)||0))best=v;uses.set(best,(uses.get(best)||0)+1);return best};
  Object.keys(VOICES).forEach(who=>{const own=(VOICES[who].g==='m'?men:women).concat(other);voiceMap[who]=take(own.length?own:pool)})}

/* ---- 🚌 ÔNIBUS DOS NÚMEROS: adding is people getting on, taking away is people getting off ----
   The bus has ten seats in two rows of five (a ten-frame); at level 3 it has a second deck with ten more.
   Level 1: everything stays in sight, so the answer can be counted. Level 2: the curtains close before people get on or off, so it has
   to be worked out. Level 3: bigger numbers, or the question is how many got on or off. The camera stands still, facing the bus stop,
   the player waits at the stop without walking, the answer is a button on the screen, and the camera can be brought close to look

/* ---- 🦘 PULOS NA RETA: adding is jumping forward on the number line, taking away is jumping back ----

   so a hop too many can be undone); "Cheguei!" checks where they stopped. Level 1 counts the hops on screen, level 2 leaves the counting
   to the child. Level 3: no hops - walk straight to the number of the answer. The camera stands still and shows the whole line. */
const LINE={A:6};
function genLine(L){const add=pickSkill('contas',['retamais','retamenos'])==='retamais',N=L===1?10:20;let a,b;
  if(L===1){b=rnd(1,3);a=add?rnd(0,N-b):rnd(b,N)}else if(L===2){b=rnd(2,5);a=add?rnd(3,N-b):rnd(b+1,N)}else{b=rnd(3,8);a=add?rnd(4,N-b):rnd(b+2,N)}
  const op=add?'+':'−',ans=add?a+b:a-b;return {a,b,op,add,N,ans,eq:`${a} ${op} ${b} = ${ans}`,ask:`${a} ${op} ${b}`,skill:lastSkill}}
function startLine(st){CH={type:'line',st,n:5,idx:0,first:0,coins:0};loadLineQ()}
function loadLineQ(){clearArena();const C=CH,G=beginArena(C.st);G.rotation.y=Math.PI/2;const lvl=stat(C.st.id).level,q=genLine(lvl),w=q.N===10?1.9:1.16,B0=-q.N*w/2;
  Object.assign(C,{q,lvl,skill:q.skill,tries:0,locked:false,w,B0,pos:q.a,hop:lvl<3?{t:1,from:q.a,to:q.a}:null,stick:0,tiles:[]});
  for(let i=0;i<=q.N;i++){const B=B0+i*w,m=mesh(BOX(2.2,.12,w-.12),i===q.a?'#FFC83D':i%2?'#BFE8FF':'#FFFFFF',LINE.A,.06,B,false);G.add(m);
    const s=sprite(texOf(g=>{g.fillStyle=i%5===0?'#2E8BF0':'#1B2232';rr(g,24,44,208,168,40);g.fill();bigText(g,String(i),128,134,180,120,'#fff')}),Math.min(1.5,w*1.02),Math.min(1.5,w*1.02));s.position.set(LINE.A-1.95,.8,B);G.add(s);C.tiles.push({m,B})}
  C.fixCam={x:LINE.A,z:0,ly:1.2,len:q.N*w+3,min:12,up:.3};
  const p=FW(C.st,LINE.A,B0+q.a*w),f=FW(C.st,LINE.A+6,B0+q.a*w);teleport(p.x,p.z,f.x,f.z);rotY=q.add?Math.PI/2:-Math.PI/2;lineMission();
  sayQ(lineText(),C.idx===0?(C.hop?'Cada toque no botão de pular é um pulo.':'Ande até o número da resposta.'):'')}
const lineText=()=>{const q=CH.q;return CH.hop?`${q.ask}: você está no ${q.a}. Dê ${q.b} ${q.b>1?'pulos':'pulo'} para ${q.add?'a frente':'trás'} e toque em Cheguei!`:`${q.ask}: você está no ${q.a}. Ande até o número da resposta e toque em Cheguei!`};
function lineMission(){const C=CH,q=C.q,n=Math.abs(C.pos-q.a);
  setMission(`<span class="vt">🦘 PULAR</span>${C.idx+1}/${C.n} · <b>${q.ask}</b>: você está no <b>${q.a}</b>. ${C.hop?`Dê <b>${q.b}</b> ${q.b>1?'pulos':'pulo'} para ${q.add?'a frente ➡':'trás ⬅'}`:'Ande até o número da resposta'} e toque em <b>Cheguei!</b>${C.hop&&C.lvl===1?`<small>Pulos: ${n}</small>`:''}`)}
/* hop mode: called every frame in place of walking */
function lineMove(dt,jx){const C=CH,q=C.q,h=C.hop,xOf=i=>C.st.c.x+C.B0+i*C.w,dir=q.add?1:-1;
  const flick=Math.abs(jx)>.6?Math.sign(jx):0,go=input.jump?dir:flick&&flick!==C.stick?flick:0;C.stick=flick;input.jump=false;
  if(go&&h.t>=1&&!C.locked&&!paused){const to=C.pos+go;if(to>=0&&to<=q.N){h.from=C.pos;h.to=to;h.t=0;C.pos=to;rotY=go>0?Math.PI/2:-Math.PI/2;sfx.jump();const n=Math.abs(to-q.a);if(C.lvl===1&&n)toast(`<b>${n}</b>`,800);lineMission()}else sfx.bad()}
  if(h.t<1)h.t=Math.min(1,h.t+dt/.3);
  P.set(xOf(h.from)+(xOf(h.to)-xOf(h.from))*h.t,Math.sin(h.t*Math.PI)*1.15,C.st.c.z-LINE.A);vy=0;onGround=h.t>=1;

function updateLine(){const C=CH,q=C.q;if(C.locked)return hideSure();
  if(!C.hop){const a=C.st.c.z-P.z,b=P.x-C.st.c.x;C.pos=Math.abs(a-LINE.A)<1.6?clamp(Math.round((b-C.B0)/C.w),0,q.N):-1}
  if(C.pos>=0&&C.pos!==q.a&&(!C.hop||C.hop.t>=1))showSure('✓ Cheguei!',lineCheck);else hideSure()}
function lineCheck(){const C=CH,q=C.q,at=C.pos,tile=i=>C.tiles[i].m.material=mat(i===q.ans?'#7CE3A0':'#FF8A80');hideSure();
  if(at===q.ans){tile(at);return okRound(null,`<b>${q.eq}</b>`,3400,nextLine)}
  C.tries++;noteErr(C.skill,q.ask,q.ans,at);
  if(C.tries>=2){tile(q.ans);return failRound(`${q.eq}. Do ${q.a}, ${q.b} ${q.b>1?'pulos':'pulo'} para ${q.add?'a frente':'trás'} chegam no <b>${q.ans}</b>.`,5600,nextLine)}
  hintBad(C.hop?`Você parou no ${at}. Volte ao ${q.a} e conte ${q.b} ${q.b>1?'pulos':'pulo'} para ${q.add?'a frente':'trás'}.`:`O ${at} não é a resposta. Comece no ${q.a} e conte ${q.b} para ${q.add?'a frente':'trás'}.`);

  C.pos=q.a;if(C.hop){C.hop.from=C.hop.to=q.a;C.hop.t=1;rotY=q.add?Math.PI/2:-Math.PI/2}else{const p=FW(C.st,LINE.A,C.B0+q.a*C.w);P.set(p.x,0,p.z);vy=0}lineMission()}

/* ---- 🗣️ O MESTRE MANDOU ----
   The master gives orders of 1, 2 or 3 steps that must be done in order, and each order is over as soon as its last step is done.
   Steps: go somewhere, jump N times, step on a coloured circle, ring the bell, walk around something, pick something up and take it
   somewhere, tag a friend, find a hidden friend, hide from the master, run from the catcher, stand like a statue.
   Now and then an order comes WITHOUT "O mestre mandou": then the right thing is to do nothing. */
const SM={house:[10,-9],bell:[-2,-10],master:[-5.5,-3.5],mats:[[-2.5,5],[-2.5,8.2],[-2.5,11.4]],
  hides:[{w:'casa',A:10,B:-9,r:2.3},{w:'arb',A:13,B:-1.5,r:1.6},{w:'arb',A:6.2,B:8.2,r:1.6}],
  items:[{k:'bola',e:'⚽',n:'a bola',A:4,B:-2},{k:'balde',e:'🪣',n:'o balde',A:8,B:-4.5},{k:'flor',e:'🌸',n:'a flor',A:0,B:2.5}],
  kids:[['vermelho','VERMELHA',7,-4],['azul','AZUL',4,6.8],['amarelo','AMARELA',12,1.5]]};
function inAB(a0,a1,b0,b1){const [a,b]=localAB(CH.st,P.x,P.z);return a>a0&&a<a1&&b>b0&&b<b1}
function distAB(A,B){const w=L2W(CH.st,A,B);return Math.hypot(P.x-w.x,P.z-w.z)}
const SM_PLACES=[
  {k:'dentro',t:'fique DENTRO do cercado',to:'dentro do cercado',ok:()=>inAB(8.4,13.6,4.4,9.6)},
  {k:'embaixo',t:'fique EMBAIXO da mesa',to:'debaixo da mesa',ok:()=>inAB(0,4,-7.6,-4.4)&&P.y<1.8},
  {k:'cima',t:'suba EM CIMA de um bloco azul',ok:()=>PLATS.some(p=>p.bloco&&p.active&&Math.abs(P.x-p.cx)<p.ha+.3&&Math.abs(P.z-p.cz)<p.hb+.3&&P.y>p.top-.15)},
  {k:'perto',t:'fique PERTO da casa',to:'perto da casa',ok:()=>distAB(10,-9)<4.8},
  {k:'longe',t:'fique LONGE da casa',ok:()=>distAB(10,-9)>20},
  {k:'entre',t:'fique ENTRE as duas árvores',to:'o meio das duas árvores',ok:()=>inAB(.4,3.6,5.6,10.4)}];
/* step makers: k = kind, ic = picture for the checklist, t = the words of the order */
const SMF={
  go:()=>{const p=pick(SM_PLACES);return {k:'go',ic:'📍',t:p.t,pk:p.k,ok:p.ok}},
  jump:()=>{const n=rnd(2,4);return {k:'jump',ic:'⬆️',t:`pule ${n} vezes`,n}},
  color:()=>{const c=pick(PAINTS);return {k:'color',ic:'⭕',t:`pise no círculo ${c.n}`,c:c.k}},
  ring:()=>{const n=rnd(1,3);return {k:'ring',ic:'🔔',t:n===1?'toque o sino':`toque o sino ${n} vezes`,n}},
  around:()=>{const o=pick([{n:'da casa',p:SM.house,r0:2.4},{n:'do sino',p:SM.bell,r0:1}]);return {k:'around',ic:'🔄',t:`dê uma volta em volta ${o.n}`,o}},
  tag:()=>{const c=pick(SM.kids);return {k:'tag',ic:'🏃',t:`pegue o amigo de camisa ${c[1]}`,c:c[0]}},
  seek:()=>{const c=pick(SM.kids);return {k:'seek',ic:'🔎',t:`ache o amigo de camisa ${c[1]} que se escondeu`,c:c[0]}},
  hide:()=>{const w=pick(['casa','arb']);return {k:'hide',ic:'🙈',t:`esconda-se do mestre atrás ${w==='casa'?'da CASA':'de um ARBUSTO'}`,w,T:7}},
  flee:()=>({k:'flee',ic:'💨',t:'fuja do pegador por 8 segundos',T:8}),
  statue:()=>({k:'statue',ic:'🗿',t:'fique parado como estátua por 3 segundos',T:3}),
  take:it=>({k:'take',ic:it.e,t:`pegue ${it.n}`,it:it.k}),
  bring:(it,p)=>({k:'bring',ic:'📦',t:`leve ${it.n} para ${p.to}`,it:it.k,pk:p.k,ok:p.ok}),
  carry:()=>{const it=pick(SM.items),p=pick(SM_PLACES.filter(p=>p.to));return {k:'carry',ic:it.e,t:`leve ${it.n} para ${p.to}`,it:it.k,itn:it.n,pk:p.k,ok:p.ok}}};
/* an order for the level: 1 step at level 1, 2 at level 2, 3 at level 3, with games and the odd trick mixed in */
function genSimon(L){const F=SMF,act=[F.go,F.jump,F.color,F.ring,F.around,F.tag,F.seek],game=()=>pick([F.hide,F.flee,F.statue])(),some=n=>sample(act,n).map(f=>f()),r=Math.random();let steps,trick=false;

  else if(L===2){if(r<.13){trick=true;steps=[pick([F.jump,F.color,F.ring])()]}else if(r<.3){const it=pick(SM.items);steps=[F.take(it),F.bring(it,pick(SM_PLACES.filter(p=>p.to)))]}else if(r<.48)steps=[...some(1),game()];else steps=some(2)}
  else{if(r<.12){trick=true;steps=[pick([F.jump,F.color,F.ring])()]}else if(r<.44){const it=pick(SM.items);steps=[F.take(it),pick([F.jump,F.around,F.color,F.ring])(),F.bring(it,pick(SM_PLACES.filter(p=>p.to)))]}else if(r<.66)steps=[...some(2),game()];else steps=some(3)}
  const t=steps.map(s=>s.t),cap=s=>s[0].toUpperCase()+s.slice(1),n=steps.length;
  const text=trick?`${cap(t[0])}!`:n===1?`O mestre mandou: ${t[0]}!`:n===2?`O mestre mandou: PRIMEIRO ${t[0]}, DEPOIS ${t[1]}!`:`O mestre mandou: PRIMEIRO ${t[0]}, DEPOIS ${t[1]} e POR FIM ${t[2]}!`;
  return {steps,trick,text,skill:tag('vocab',trick?'pegadinha':'cmd'+n),time:trick?6:(9+12*n+sum(steps.map(s=>s.T||0)))*(L===1?1.3:1)}}
function startSimon(st){CH={type:'simon',st,n:6,idx:0,first:0,coins:0,hearts:3};clearArena();const G=beginArena(st),C=CH,lab=(t,A,y,B,s)=>{const sp=sprite(texOf(g=>bigText(g,t,128,128,236,52,INK)),s||2.2,s||2.2);sp.position.set(A,y,B);G.add(sp)};
  dHouse(10,-9)(G);lab('CASA',10,4.8,-9);
  [[2,4.6],[2,11.4]].forEach(([A,B])=>{G.add(mesh(BOX(.8,2.4,.8),'#8B5A2B',A,1.2,B),mesh(BOX(2.6,2.2,2.6),'#2FA84F',A,3.4,B));addColl(A,B,.7)});
  G.add(mesh(BOX(5.2,.04,5.2),'#FFF1B8',11,.03,7,false));[[11,4.4,5.2,.2],[11,9.6,5.2,.2],[13.6,7,.2,5.2]].forEach(([A,B,wa,wb])=>{G.add(mesh(BOX(wa,.9,wb),'#E0A800',A,.45,B));platAt(st,A,B,wa/2,wb/2,.9,true,null,.05)});lab('CERCADO',11,2.4,7,2.4);
  G.add(mesh(BOX(4.4,.35,3.6),'#B07A44',2,3.25,-6));[[.1,-7.6],[3.9,-7.6],[.1,-4.4],[3.9,-4.4]].forEach(([A,B])=>{G.add(mesh(BOX(.3,3.2,.3),'#8A552D',A,1.6,B));addColl(A,B,.25)});lab('MESA',2,4.6,-6);
  [[6.5,-.6],[8.4,2.2],[5.2,2.8]].forEach(([A,B])=>{G.add(mesh(BOX(1.6,.9,1.6),'#2E8BF0',A,.45,B));const p=platAt(st,A,B,.8,.8,.9,true,null,.1);p.bloco=true});
  /* bell, coloured circles, two bushes to hide behind */
  const [bA,bB]=SM.bell;G.add(mesh(BOX(.3,2.9,.3),'#7A4B2A',bA,1.45,bB),mesh(BOX(.3,.3,1.3),'#7A4B2A',bA,2.9,bB+.5),mesh(new THREE.ConeGeometry(.5,.75,14),GOLD,bA,2.35,bB+.95));addColl(bA,bB,.4);lab('SINO',bA,4,bB);C.bell=L2W(st,bA,bB+.6);
  C.mats=SM.mats.map(([A,B],i)=>{const c=PAINTS[i],w=L2W(st,A,B);G.add(mesh(new THREE.CylinderGeometry(1.45,1.45,.06,32),INK,A,.03,B,false),mesh(new THREE.CylinderGeometry(1.3,1.3,.08,32),c.c,A,.05,B,false));
    const sp=sprite(texOf(g=>{fitText(g,c.n,236,44);g.textAlign='center';g.textBaseline='middle';g.lineWidth=8;g.strokeStyle=INK;g.strokeText(c.n,128,128);g.fillStyle='#fff';g.fillText(c.n,128,128)}),2,2);sp.position.set(A,1.1,B);G.add(sp);return {k:c.k,n:c.n,x:w.x,z:w.z}});
  SM.hides.filter(h=>h.w==='arb').forEach(h=>{G.add(mesh(BOX(2.7,1.9,2.7),'#2FA84F',h.A,.95,h.B),mesh(BOX(1.9,.9,1.9),'#47C266',h.A,2.3,h.B));addColl(h.A,h.B,1.6);lab('ARBUSTO',h.A,3.7,h.B)});
  /* things to carry */
  C.items=SM.items.map(it=>{const sp=sprite(texOf(pEmo(it.e)),1.5,1.5),h=L2W(st,it.A,it.B);scene.add(sp);CHX.sprites.push(sp);return {k:it.k,n:it.n,sp,hx:h.x,hz:h.z,x:h.x,z:h.z}});
  /* the master and three friends in coloured shirts */
  const mk=(lk,A,B,name)=>{const ch=makeChar(lk),w=L2W(st,A,B);ch.g.position.set(w.x,0,w.z);ch.g.rotation.y=Math.PI/2;scene.add(ch.g);CHX.objs.push(ch.g);if(name){const ns=sprite(labelTex(name,'#fff',null,256,64,40),2.2,.55);ns.position.y=name==='MESTRE'?4.6:3.3;ch.g.add(ns);CHX.texs.push(ns.material.map)}return {ch,x:w.x,z:w.z}};
  C.master=mk({skin:'#E9B07F',shirt:'#6A3DE8',pants:'#20242E',hat:'mago',hair:'#B3BCC7'},SM.master[0],SM.master[1],'MESTRE');
  C.kids=SM.kids.map(([k,n,A,B],i)=>Object.assign(mk({skin:['#FFD9B3','#8D5A3B','#C98E5F'][i],shirt:PAINTS.find(c=>c.k===k).c,pants:'#1F4FA0',hat:'nenhum',hair:['#1E1A1A','#5A3A22','#E8C15A'][i]},A,B),{c:k,n,hx:0,hz:0,tx:0,tz:0,wait:0,hid:false,chase:false,ph:i}));
  C.kids.forEach(f=>{f.hx=f.x;f.hz=f.z;f.tx=f.x;f.tz=f.z});
  const w=L2W(st,-3,0),f=L2W(st,6,0);teleport(w.x,w.z,f.x,f.z);loadSimonQ()}
function loadSimonQ(force){const C=CH,L=stat(C.st.id).level;let q=force;if(!q)do q=genSimon(L);while(C.q&&q.steps[0].k===C.q.steps[0].k&&Math.random()<.8);

  Object.assign(C,{q,skill:q.skill,si:0,hold:null,time:q.time,phase:'read',locked:false,tries:0});showProg(null);simonMission();
  speak(plain(q.text),()=>{if(CH===C&&C.q===q&&C.phase==='read'){C.phase='play';simonMission()}})}
function simonMission(){const C=CH,q=C.q;
  const body=q.trick?`<b>${q.text}</b>`:q.steps.map((s,i)=>`<span class="stp ${i<C.si?'done':i===C.si?'cur':'todo'}">${i<C.si?'✓':s.ic} ${s.t}${s.live&&i===C.si?` <small>${s.live}</small>`:''}</span>`).join(' ');
  setMission(`<span class="vt">🗣️ MESTRE</span>${C.idx+1}/${C.n} · ${body}<small class="live">${C.phase==='read'?'<span class="rd">🗣️ Escute o mestre com atenção...</span><span class="rs">🗣️ …</span>':'⏱ '+Math.ceil(Math.max(0,C.time))+'s'} · ${'❤️'.repeat(Math.max(0,C.hearts))}${'🖤'.repeat(3-Math.max(0,C.hearts))}</small>`)}
/* friends: they stroll about, run away while they are being chased in a tag step, and one of them can be the catcher */
function simonKids(dt){const C=CH,st=C.st,step=C.phase==='play'&&!C.locked?C.q.steps[C.si]:null,flee=step&&step.k==='tag',mid=L2W(st,5,0);
  for(const f of C.kids){const L=f.ch;if(f.hid){L.legL.rotation.x=L.legR.rotation.x=0;continue}
    const dx=P.x-f.x,dz=P.z-f.z,d=Math.hypot(dx,dz)||1e-3;let vx=0,vz=0,sp=0;
    if(f.chase){if(f.hold>0)f.hold-=dt;else{vx=dx/d;vz=dz/d;sp=4.3}}
    else if(flee&&d<7){const cx=mid.x-f.x,cz=mid.z-f.z,cd=Math.hypot(cx,cz)||1e-3,w=clamp((cd-6)/5,0,1)*1.4;vx=-dx/d+cx/cd*w;vz=-dz/d+cz/cd*w;const m=Math.hypot(vx,vz)||1;vx/=m;vz/=m;sp=4}
    else{const tx=f.tx-f.x,tz=f.tz-f.z,td=Math.hypot(tx,tz);f.wait-=dt;if(td<.6||f.wait<-9){if(f.wait<=0){const t=L2W(st,rnd(-1,13),rnd(-10,10));f.tx=t.x;f.tz=t.z;f.wait=rnd(1,4)}}else if(f.wait<=0){vx=tx/td;vz=tz/td;sp=1.6}}
    f.x+=vx*sp*dt;f.z+=vz*sp*dt;
    for(const c of COLL){const ox=f.x-c.x,oz=f.z-c.z,od=Math.hypot(ox,oz),r2=c.r+.45;if(od<r2&&od>1e-4){f.x=c.x+ox/od*r2;f.z=c.z+oz/od*r2}}
    const [a,b]=localAB(st,f.x,f.z),q=L2W(st,clamp(a,-4,14),clamp(b,-12,12));f.x=q.x;f.z=q.z;L.g.position.set(f.x,0,f.z);
    if(sp){L.g.rotation.y=lerpA(L.g.rotation.y,Math.atan2(vx,vz),Math.min(1,dt*10));f.ph+=dt*sp*1.7;const s=Math.sin(f.ph)*.8;L.legL.rotation.x=s;L.legR.rotation.x=-s;L.armL.rotation.x=-s;L.armR.rotation.x=s}
    else{L.legL.rotation.x=L.legR.rotation.x=L.armL.rotation.x=0;L.armR.rotation.x=d<4?-Math.abs(Math.sin(T*6))*1.5:0;L.g.rotation.y=lerpA(L.g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*4))}}}

/* ================= THE REPORT (parents area): how the child is doing, in teaching terms =================
   For each skill the situation comes from the latest answers (up to twelve are kept), so it follows what the child can do now:
   0 not practised yet · 1 hardly practised (fewer than 5 answers) · 2 needs help (under 60% right at the first try) ·
   3 getting there (60% to 84%) · 4 mastered (85% or more, with at least 8 answers). */
/* a day counts as a day of play when something was answered, a round ended, or the game was open for a minute */
const dayPlayed=d=>!!d&&(d.q>0||d.r>0||d.t>=60);
const REP_ST=[['#C9CED6','Ainda não praticou'],['#C9CED6','Pouco praticado'],['#E53935','Precisa de ajuda'],['#FFC83D','Em progresso'],['#22B35E','Domina']];
function skillState(k){if(!k||!k.n)return 0;if(k.n<5)return 1;const h=k.h||'',rate=h.length>=5?(h.split('1').length-1)/h.length:k.f/k.n;return rate>=.85&&k.n>=8?4:rate>=.6?3:2}
/* the sums skills, from understanding (objects in sight) to working out (the written sum) */
const REP_SUMS=[['contas.juntar','Entender'],['contas.tirar','Entender'],['contas.retamais','Entender'],['contas.retamenos','Entender'],['contas.comparar','Entender'],['contas.falta','Pensar ao contrário'],['contas.soma','Calcular'],['contas.sub','Calcular'],['contas.decompor','Calcular'],['n100.conta','Aplicar'],['dinheiro.troco','Aplicar']];
function reportData(){const days=n=>{const out=[];for(let i=0;i<n;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);out.push(dKey(d))}return out};
  flushTime();const agg=ks=>ks.reduce((a,k)=>{const d=S.days[k];if(dayPlayed(d)){a.days++;a.t+=d.t;a.q+=d.q;a.f+=d.f;a.r+=d.r;a.m+=d.m}return a},{days:0,t:0,q:0,f:0,r:0,m:0}),d14=days(14);
  const R={name:S.name||'Jogador',week:agg(d14.slice(0,7)),prev:agg(d14.slice(7)),last7:d14.slice(0,7).reverse().map(k=>[k,S.days[k]||null])};
  R.sums=REP_SUMS.map(([id,step])=>{const k=S.sk[id]||{n:0,f:0,h:''};return {id,step,k,s:skillState(k)}});
  R.areas=STATIONS.map(st=>{const t=stat(st.id),sk=Object.keys(SKN).filter(id=>id.startsWith(st.id+'.')).map(id=>({id,k:S.sk[id],s:skillState(S.sk[id])}));

    <div class="btns" style="justify-content:flex-start"><button class="btn" id="p-free"${Object.keys(S.rest).length?'':' disabled'}>Liberar os jogos em descanso (${Object.keys(S.rest).length})</button></div>
    <div class="sec">Por estação</div>
    <div class="tbl"><table><thead><tr><th>Capítulo</th><th>Estação</th><th>Nível</th><th>Rodadas</th><th>De primeira</th><th>Troféu</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.sub}</td><td>${r.s.name}</td><td>${r.t.level}/3</td><td>${r.t.rounds}</td><td>${pc(r.t.first,r.t.total)}</td><td>${(MEDAL[S.trophies[r.s.id]||0]||'—')}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec">Semana a semana (acertos de primeira)</div>
    ${any?`<div class="tbl"><table><thead><tr><th>Estação</th>${wks.map((w,i)=>`<th>${i===3?'Esta semana':'Sem. de '+w.slice(8)+'/'+w.slice(5,7)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.name}</td>${wks.map(w=>{const a=(S.wk[w]||{})[r.s.id];return `<td>${a?pc(a[0],a[1]):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="small">Sem respostas nas últimas 4 semanas.</div>'}
    <div class="sec">Por habilidade</div>
    ${sk.length?`<div class="tbl"><table><thead><tr><th>Habilidade</th><th>Estação</th><th>De primeira</th><th>Situação</th></tr></thead><tbody>${sk.map(x=>{const [c,l]=state(x.k);return `<tr><td>${esc(skillName(x.id))}</td><td>${x.st.name}</td><td>${pc(x.k.f,x.k.n)}</td><td><span class="dot" style="background:${c}"></span>${l}${x.k.w?' · volta nas próximas rodadas':''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="small">Aparece aqui depois das primeiras respostas.</div>'}
    <p class="small" style="line-height:1.45">A situação pesa mais as respostas recentes. O que a criança erra volta nas rodadas seguintes, até acertar duas vezes de primeira. O nível sobe com 80% de acertos de primeira e desce abaixo de 40%. Medalha de cada rodada: ouro com tudo certo de primeira, prata com a metade ou mais, bronze com pelo menos um acerto de primeira. A estação guarda a melhor. Medalha de ouro no nível 3 vira a taça de ouro da estação, e as 8 taças dão a Taça dos Campeões. As moedas de bônus acompanham os acertos de primeira.</p>
    <div class="sec">Ajustes</div>
    <form id="nm" class="field"><input id="nm-in" maxlength="14" value="${esc(S.name)}" aria-label="Nome do jogador"><button class="btn gold">Salvar nome</button></form>
    <div class="field" style="margin-top:10px"><label for="p-br" style="font-family:var(--fb);font-size:17px">Aviso de pausa:</label><select id="p-br">${[0,15,20,30,45].map(m=>`<option value="${m}"${S.breakMin===m?' selected':''}>${m?`a cada ${m} minutos`:'desligado'}</option>`).join('')}</select></div>
    <div class="sec">Cópia de segurança</div>
    <div class="small" style="margin-bottom:8px">O progresso fica só neste aparelho. Salve uma cópia para não perder, ou para levar a outro aparelho.</div>
    <div class="btns" style="justify-content:flex-start"><button class="btn" id="p-ex">💾 Salvar cópia</button><button class="btn" id="p-im">📂 Restaurar cópia</button><input type="file" id="p-file" accept="application/json,.json" hidden></div>
    <div class="btns" style="justify-content:flex-start;margin-top:18px"><button class="btn" id="p-rs" style="background:var(--badbg)">Apagar progresso deste jogador</button>${PF.ids.length>1?'<button class="btn" id="p-del" style="background:var(--badbg)">Remover este jogador</button>':''}</div></div>`);
  $('#p-x').onclick=()=>closeSheet();$('#p-rep').onclick=()=>{sfx.tap();openReport()};
  $('#p-mis').onchange=e=>{S.misOn=e.target.checked;save();hud();toast(S.misOn?'Missão ligada: só ela libera a troca da Loja.':'Missão desligada: qualquer rodada com estrela libera a troca.',3200)};
  $('#p-rest').onchange=e=>{S.restOn=e.target.checked;save();STATIONS.forEach(updateSign);toast(S.restOn?'Descanso do ouro ligado.':'Descanso do ouro desligado: todos os jogos ficam abertos.',3200)};
  $('#p-free').onclick=()=>{S.rest={};save();STATIONS.forEach(updateSign);parents();toast('Todos os jogos estão liberados.',2600)};
  $('#nm').onsubmit=e=>{e.preventDefault();const v=$('#nm-in').value.trim();if(v){S.name=v.slice(0,14);save();hud();buildPlayer();toast('Nome salvo!')}};
  $('#p-br').onchange=e=>{S.breakMin=+e.target.value;playT=0;save();toast(S.breakMin?`Aviso de pausa a cada ${S.breakMin} minutos.`:'Aviso de pausa desligado.')};
  $('#p-ex').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'ilha-dos-numeros',v:1,when:new Date().toISOString(),save:S})],{type:'application/json'}));
      a.download=`ilha-dos-numeros-${(S.name||'jogador').replace(/[^\wÀ-ɏ-]+/g,'_')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Cópia salva na pasta de downloads.')}catch(e){toast('Não consegui salvar a cópia neste aparelho.')}};
  $('#p-im').onclick=()=>{if(!armIm){armIm=true;$('#p-im').textContent='Toque de novo: substitui este jogador';return}$('#p-file').click()};
  $('#p-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onerror=()=>toast('Não consegui ler o arquivo.');
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!isObj(d)||d.app!=='ilha-dos-numeros'||!isObj(d.save)||!isObj(d.save.st))throw 0;S=normalize(d.save);S.tut=true;save();location.reload()}catch(_){toast('Esse arquivo não é uma cópia do jogo.')}};r.readAsText(f)};
  $('#p-rs').onclick=()=>{if(!arm){arm=true;$('#p-rs').textContent='Toque de novo para confirmar';return}S=normalize({name:S.name,tut:true,sound:S.sound,music:S.music,musStyle:S.musStyle,voice:S.voice,caps:S.caps,breakMin:S.breakMin,misOn:S.misOn,restOn:S.restOn});save();hud();buildPlayer();STATIONS.forEach(updateSign);updateHall();closeSheet();toast('Progresso apagado.')};
  if($('#p-del'))$('#p-del').onclick=()=>{if(!armDel){armDel=true;$('#p-del').textContent='Toque de novo para remover';return}try{localStorage.removeItem(KEY)}catch(e){}PF.ids=PF.ids.filter(i=>i!==PF.cur);PF.cur=PF.ids[0];savePF();location.reload()}}
/* optional reminder to take a break (set in the parents area); it waits for the current challenge to end */
let playT=0;
function breakCheck(dt){if(!S.breakMin)return;playT+=dt;if(playT<S.breakMin*60||CH||paused||pendFin)return;playT=0;
  openSheet(`<div class="result"><h2>Hora da pausa! 🧃</h2><p>Você já jogou ${S.breakMin} minutos. Que tal beber água, esticar o corpo e descansar os olhos?</p><div class="btns"><button class="btn go" id="br-ok">Voltei! ▶</button></div></div>`);
  $('#br-ok').onclick=()=>{sfx.tap();closeSheet()};speak('Hora da pausa! Que tal beber água e descansar os olhos?')}
$('#b-menu').onclick=()=>{sfx.tap();openMenu()};
$('#b-sound').onclick=()=>{S.sound=!S.sound;save();hud();if(ambBus)ambBus.gain.setTargetAtTime(S.sound?1:0,actx.currentTime,.3);sfx.tap();toast(S.sound?'Efeitos de som ligados 🔊':'Efeitos de som desligados',1500)};
/* the music button goes round: rock, calm, off */
$('#b-music').onclick=()=>{if(!S.music){S.music=true;S.musStyle='rock'}else if(S.musStyle!=='calma')S.musStyle='calma';else S.music=false;save();hud();ensureAudio();musicOn(S.music);toast(!S.music?'Música desligada':S.musStyle==='calma'?'Música calma 🎹':'Rock ligado 🎸',1600)};
$('#b-cele').onclick=()=>{if(paused)return;sfx.tap();openCeles()};
$('#b-mis').onclick=()=>{if(paused)return;sfx.tap();openMission()};
$('#b-voice').onclick=()=>{S.voice=!S.voice;save();hud();if(!S.voice)try{speechSynthesis.cancel()}catch(e){}toast(S.voice?'A voz vai ler as perguntas 🗣️':'Voz desligada',1800,S.voice)};

/* ================= LOOP ================= */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(CH&&CH.fp)scopeFov();if(CH){CH.camTop=0;if(CH.type==='gol')CH.relay=true}layoutTop()}
addEventListener('resize',resize);
let last=performance.now(),qN=0,qT=0,autoQual=true;
function tick(now){requestAnimationFrame(tick);const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;
  /* every 2.5 seconds of play: under 27 frames per second, step the picture quality down once (a long gap, such as a tab switch, restarts the count) */
  if(autoQual&&QUAL>0&&!document.hidden){if(raw>1){qN=0;qT=0}else{qT+=raw;qN++;if(qT>=2.5){if(T>3&&qN/qT<27)setQuality(QUAL-1);qN=0;qT=0}}}
  if(!paused&&!document.hidden)dayT+=dt;
  updatePlayer(dt);updatePet(dt);updateWorld(dt);update3D(dt);updatePortals(dt);updateFx(dt);updateCam(dt);updateNear();breakCheck(dt);renderer.render(scene,camera)}
function boot(){if(S.lite)setQuality(0);resize();buildPlayer();hud();STATIONS.forEach(updateSign);updateHall();camera.position.set(P.x,P.y+5,P.z+10);requestAnimationFrame(tick);if(!S.tut)openTut()}
window.__ilhaDebug={CAT,buyQ,speak,mission,newMission,missionNote,restNote,resting,openMission,talk,parents,openReport,reportData,reportText,skillState,DAY,noteErr,flushTime,set dayT(v){dayT=v},pickVoice,openVoices,openSiu,playSiu,get siu(){return siuData},get siuBuf(){return !!siuBuf},camera,SCOPE,CELES,HAIR_SHAPES,VOICES,voiceFor,celeSnd,playAnim,celebrate,openCeles,get PL(){return PL},get amb(){return !!ambSea},get camMode(){return camMode},SM,simonLoad:q=>loadSimonQ(q),buildPlayer,set forceVerb(v){forceVerb=v},set rotY(v){rotY=v},get rotY(){return rotY},set timeScale(v){TS=v},get onGround(){return onGround},scene,input,get QUAL(){return QUAL},setQuality,set autoQual(v){autoQual=v},renderer,PLATS,SHAPES,lastSkill:()=>lastSkill,record,starsFor,finishChallenge,flushFin,breakCheck,get keys(){return keys},get camRot(){return camRot},get pendFin(){return pendFin},get PF(){return PF},get CH(){return CH},get standing(){return standing},get yaw(){return yaw},set yaw(v){yaw=v},get WORLD(){return WORLD},P,L2W,STM,FRIENDS,HALL,PORTALS,
  aim:()=>CH&&CH.type==='shoot'?aimBalloon():null,set pitch(v){pitch=v},step:dt=>{updatePlayer(dt);update3D(dt);updatePortals(dt);updateCam(dt);updateNear()},startMode,enterWorld,leaveWorld,fire,closeSheet,playAnim,get ANIM(){return ANIM},audio:()=>({state:actx&&actx.state,step:mStep,bpm:song.bpm,parts:PARTS.length}),jump:()=>{input.jump=true},checkTrophies,S:()=>S};
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 40px Fredoka'),document.fonts.load('400 20px Andika')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1800))]).then(()=>{OBBY.boards.forEach((b,k)=>drawBoard(k,'? + ?',false));boot()}).catch(boot);
})();
</script>
