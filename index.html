<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilha dos Números</title>
<meta name="description" content="Jogo 3D de matemática do 1º ano: contar, somar, formas, dinheiro e medidas.">
<meta name="theme-color" content="#1B2232">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ilha dos Números">
<link rel="preload" href="fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are served from this site (no third-party requests). */
@font-face{font-family:'Fredoka';font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Andika';font-weight:400;font-display:swap;src:url(fonts/andika-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Andika';font-weight:700;font-display:swap;src:url(fonts/andika-latin-700-normal.woff2) format('woff2')}
/* Layout: full-screen 3D. A central city with portals to 8 themed worlds; every exercise is played with the avatar. HUD floats on top. Single bright game look. */
:root{
  --ink:#1B2232; --paper:#FFFFFF;
  --glass:rgba(16,22,36,.62); --go:#22B35E; --gold:#FFC83D; --red:#E53935; --muted:#5B6475;
  --ok:#22A55A; --okbg:#DDF6E6; --badbg:#FFE3E0;
  --fd:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --fb:'Andika','Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#8FD3FF;color:var(--ink);font-family:var(--fd);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body.caps{text-transform:uppercase}
body.caps input{text-transform:none}
button,select{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;text-transform:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
input{user-select:text;-webkit-user-select:text}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 56%,rgba(8,18,44,.2) 100%)}
#touch{position:fixed;inset:0;z-index:1;touch-action:none}
.hud-top{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap}
.hud-top>*{pointer-events:auto}
.chip{background:var(--glass);color:#fff;border-radius:12px;padding:7px 11px;font-weight:600;font-size:18px;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2)}}
.sp{flex:1}
.hbtn{width:46px;height:46px;border-radius:12px;background:var(--glass);border:0;color:#fff;font-size:22px;display:grid;place-items:center;padding:0;position:relative}
.hbtn.off{opacity:.55}
.hbtn.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;background:#FF5F57;transform:rotate(-40deg);border-radius:2px}
#where{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);color:#fff;border-radius:10px;padding:4px 12px;font-size:14px;font-weight:600;white-space:nowrap}
#mission{position:fixed;z-index:5;top:calc(var(--hudh,56px) + 8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:6px 6px 6px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;line-height:1.25;box-shadow:0 5px 0 var(--ink)}
#mission b{color:var(--red)}
#mission .vt{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;margin-right:4px;font-size:15px;vertical-align:2px}
#mission small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
#m-text{cursor:pointer}
/* folded: only the action tag, the question counter and, in timed games, the clock and hearts stay on screen */
#mission.min{padding:3px 3px 3px 8px;gap:5px;border-width:3px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
#mission.min #m-text{font-size:0;line-height:0;display:flex;align-items:center;gap:6px;white-space:nowrap}
#mission.min #m-text>*{display:none}
#mission.min #m-text .vt{display:inline-block;font-size:13px;line-height:1.4;margin:0;vertical-align:0}
#mission.min #m-text .cnt{display:inline;font-size:15px;line-height:1.4}
#mission.min #m-text small.live{display:block;font-size:14px;line-height:1.4;color:var(--ink);font-weight:600}
#mission .rs{display:none}
#mission.min .rd{display:none}
#mission.min .rs{display:inline}
#mission.min .mb{width:38px;height:38px;font-size:16px;border-width:2px;border-radius:9px}
#mission .mb{width:40px;height:40px;flex:none;border-radius:10px;border:3px solid var(--ink);background:var(--gold);display:grid;place-items:center;padding:0;font-size:18px}
#mission .mb.q{background:#fff}
.hud-br{position:fixed;z-index:5;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.hud-row{display:flex;align-items:flex-end;gap:10px}
.rot{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.82);border:4px solid var(--ink);font-size:26px;font-weight:700;box-shadow:0 4px 0 var(--ink);padding:0;touch-action:none}
.rot.on{background:var(--gold);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#b-jump,#b-fire{width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.9);border:4px solid var(--ink);font-size:38px;font-weight:700;box-shadow:0 5px 0 var(--ink);padding:0;touch-action:none}
#b-fire{background:#FF6B5E}
#b-jump:active,#b-fire:active,#b-act:active,#b-sure:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#b-sure{padding:13px 18px;border-radius:16px;background:var(--gold);border:4px solid var(--ink);font-weight:700;font-size:20px;box-shadow:0 5px 0 var(--ink)}
#b-act{padding:13px 18px;border-radius:16px;background:var(--go);color:#fff;border:4px solid var(--ink);font-weight:700;font-size:20px;box-shadow:0 5px 0 var(--ink);animation:pulse 1.2s infinite;max-width:60vw}
@keyframes pulse{50%{transform:scale(1.06)}}
#joy{position:fixed;z-index:4;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.7);pointer-events:none;box-sizing:border-box}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink)}
#toast{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(230px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:19px;max-width:calc(100% - 40px);text-align:center;line-height:1.3}
#toast b{color:var(--gold)}
#fade{position:fixed;inset:0;z-index:20;background:#0B1020;opacity:0;pointer-events:none;transition:opacity .35s;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700}
#fade.on{opacity:1}
#ov{position:fixed;inset:0;z-index:10;background:rgba(10,16,30,.5);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
#ov.bottom{align-items:flex-end;background:linear-gradient(transparent 40%,rgba(10,16,30,.35))}
.sheet{width:100%;max-width:660px;max-height:100%;overflow-y:auto;overflow-x:hidden;background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);box-sizing:border-box;-webkit-overflow-scrolling:touch}
#ov.bottom .sheet{max-height:58%}
.pad{padding:18px}
.btn{border:4px solid var(--ink);border-radius:14px;background:#fff;padding:12px 18px;font-weight:700;font-size:19px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--go);color:#fff}
.btn.gold{background:var(--gold)}
.btn.icon{padding:12px 14px}
.btn.big{font-size:26px;min-width:90px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.h2{font-weight:700;font-size:26px;margin:0 0 8px}
.small{font-size:15px;color:var(--muted)}
.xbtn{width:42px;height:42px;border-radius:10px;border:3px solid var(--ink);background:#fff;font-size:18px;padding:0;flex:none}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg-name{align-self:flex-start;background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:700;font-size:20px;-webkit-text-stroke:.5px var(--ink)}
.dlg p{margin:0;font-family:var(--fb);font-size:21px;line-height:1.4}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{display:flex;gap:10px;align-items:center;text-align:left;border:4px solid var(--ink);border-radius:16px;background:var(--c);color:#fff;padding:12px;box-shadow:0 4px 0 var(--ink)}
.mode .mi{font-size:34px;line-height:1;background:#fff;border-radius:12px;width:52px;height:52px;display:grid;place-items:center;flex:none;border:3px solid var(--ink)}
.mode b{display:block;font-size:20px;-webkit-text-stroke:.4px var(--ink)}
.mode small{display:block;font-size:14px;font-weight:500;opacity:.95}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.result{padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result h2{margin:0;font-weight:700;font-size:34px}
.bigstars{font-size:54px;letter-spacing:6px}
.bigstars .off{filter:grayscale(1);opacity:.3}
.result p{margin:0;font-family:var(--fb);font-size:20px}
.pillmsg{background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:6px 14px;font-weight:700;font-size:19px}
.award{display:flex;flex-direction:column;align-items:center;gap:6px;background:#1B2232;color:#FFE27A;border-radius:16px;padding:12px 18px;border:4px solid #FFC83D}
.award b{font-size:22px}
.award canvas{width:160px;height:160px}
.shop-h{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.shop-h .h2{margin:0;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px}
.tab{flex:none;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:7px 12px;font-weight:600;font-size:16px}
.tab.on{background:var(--gold)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;padding:0 14px 16px}
.item{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:600;text-align:center;box-shadow:0 3px 0 var(--ink)}
.item.eq{background:var(--okbg)}
.item .pv{font-size:40px;height:48px;display:grid;place-items:center;line-height:1}
.sw{display:block;width:44px;height:44px;border:3px solid var(--ink);border-radius:8px;background:var(--k);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18)}
.st{font-size:15px;padding:2px 10px;border-radius:8px;border:2px solid var(--ink);background:#fff}
.item.eq .st{background:var(--ok);color:#fff}
.st.price{background:var(--gold)}
.item.poor .st.price{background:#eee;color:var(--muted)}
.item small{font-weight:500;color:var(--muted);font-size:13px}
.quiz{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.quiz p{margin:0;font-family:var(--fb);font-size:22px;line-height:1.4}
.quiz .fb{min-height:28px;font-family:var(--fb);font-size:18px;color:#B3261E}
.menu{padding:16px;display:flex;flex-direction:column;gap:10px}
.travel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.travel button{border:3px solid var(--ink);border-radius:12px;background:var(--c);padding:10px;text-align:left;font-weight:600;font-size:16px;line-height:1.15;color:#fff;-webkit-text-stroke:.3px var(--ink)}
.travel small{display:block;font-weight:500;font-size:13px;-webkit-text-stroke:0;opacity:.95}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px;font-family:var(--fb)}
th,td{padding:8px 6px;border-bottom:2px solid #E3E7EF;text-align:left;white-space:nowrap}
th{font-family:var(--fd);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field input{font:inherit;font-size:20px;padding:10px 12px;border:3px solid var(--ink);border-radius:10px;width:150px;min-width:0}
.tut{display:grid;grid-template-columns:56px 1fr;gap:10px 12px;align-items:center;font-family:var(--fb);font-size:19px;line-height:1.3;margin:10px 0 16px}
.tut .i{font-size:32px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cf{position:fixed;top:-20px;width:12px;height:12px;border:2px solid rgba(0,0,0,.4);z-index:30;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:20px;background:#8FD3FF;z-index:50}
.sec{font-weight:700;font-size:19px;margin:16px 0 4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.players button{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:10px;text-align:left;font-weight:600;font-size:17px}
.players button.on{background:var(--okbg)}
.players small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
select{font-size:17px;padding:8px;border:3px solid var(--ink);border-radius:10px;background:#fff}
@media (max-width:520px){#where{display:none}.chip{font-size:15px;padding:6px 8px}.hbtn{width:42px;height:42px;font-size:20px}}
@media (max-height:520px){#toast{bottom:calc(112px + env(safe-area-inset-bottom,0px));max-width:56%;font-size:16px;padding:8px 14px}#mission{font-size:16px;border-width:3px;box-shadow:0 3px 0 var(--ink)}#mission small{font-size:12px}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.shake,#b-act,.chip.bump{animation:none}#fade{transition:none}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vig"></div>
<div id="touch"></div>
<div id="joy"><div id="knob"></div></div>
<header class="hud-top">
  <div class="chip" id="h-name">Jogador</div>
  <div class="chip" id="h-c"><span>🪙</span><b id="h-coins">0</b></div>
  <div class="chip" id="h-s"><span>⭐</span><b id="h-stars">0</b></div>
  <div class="chip" id="h-t"><span>🏆</span><b id="h-troph">0</b></div>
  <span class="sp"></span>
  <button class="hbtn" id="b-music" aria-label="Música">🎸</button>
  <button class="hbtn" id="b-voice" aria-label="Voz que lê as perguntas">🗣️</button>
  <button class="hbtn" id="b-sound" aria-label="Efeitos de som">🔊</button>
  <button class="hbtn" id="b-menu" aria-label="Menu">☰</button>
</header>
<div id="mission" hidden><span id="m-text" aria-live="polite"></span><button class="mb q" id="m-min" aria-label="Encolher as instruções" aria-expanded="true">▴</button><button class="mb q" id="m-spk" aria-label="Ouvir">🗣️</button><button class="mb" id="m-quit" aria-label="Sair do desafio">✕</button></div>
<div id="where">Cidade dos Números</div>
<div class="hud-br">
  <button id="b-act" hidden></button>
  <button id="b-sure" hidden></button>
  <button id="b-fire" hidden aria-label="Atirar">🎯</button>
  <div class="hud-row">
    <button class="rot" id="b-rl" aria-label="Girar câmera para a esquerda">⟲</button>
    <button class="rot" id="b-rr" aria-label="Girar câmera para a direita">⟳</button>
    <button id="b-jump" aria-label="Pular">⬆</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="fade"></div>
<div id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const setEq=(s,t)=>s.length===t.length&&t.every(i=>s.includes(i));
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ================= SAVE ================= */
/* One save per player profile. Profile 0 keeps the original key, so older saves keep working. */
const KEY0='ilha-numeros-3d-v1',PKEY='ilha-numeros-perfis',MAXP=6;
let PF=null;
try{PF=JSON.parse(localStorage.getItem(PKEY))}catch(e){}
if(!PF||!Array.isArray(PF.ids)||!PF.ids.length)PF={cur:0,ids:[0],next:1};
if(!PF.ids.includes(PF.cur))PF.cur=PF.ids[0];
const keyOf=id=>id?KEY0+'-p'+id:KEY0,KEY=keyOf(PF.cur);
function savePF(){try{localStorage.setItem(PKEY,JSON.stringify(PF))}catch(e){}}
function readSave(id){try{return JSON.parse(localStorage.getItem(keyOf(id)))}catch(e){return null}}
const DEF={name:'',coins:0,stars:0,sound:true,music:true,voice:true,caps:false,breakMin:0,tut:false,look:{skin:'s2',hair:'castanho',shirt:'azul',pants:'jeans',hat:'nenhum',pet:'nenhum'},lite:false,misMin:false,owned:[],st:{},trophies:{},champ:false,sk:{},wk:{}};
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function normalize(raw){const s=Object.assign(JSON.parse(JSON.stringify(DEF)),isObj(raw)?raw:{});s.look=Object.assign({},DEF.look,isObj(s.look)?s.look:{});
  ['st','trophies','sk','wk'].forEach(k=>{if(!isObj(s[k]))s[k]={}});if(!Array.isArray(s.owned))s.owned=[];s.name=String(s.name||'').slice(0,14);s.coins=Math.max(0,Math.round(+s.coins)||0);s.stars=Math.max(0,Math.round(+s.stars)||0);s.breakMin=[0,15,20,30,45].includes(+s.breakMin)?+s.breakMin:0;
  const num=(o,ks)=>ks.forEach(k=>o[k]=Math.max(0,+o[k]||0));
  Object.keys(s.st).forEach(k=>{const t=s.st[k];if(!isObj(t))return delete s.st[k];num(t,['rounds','first','total','stars']);t.level=Math.min(3,Math.max(1,Math.round(+t.level)||1))});

function makeMelody(seed){let s=seed*7919;const r=()=>(s=(s*9301+49297)%233280)/233280,sc=[0,2,4,7,9,12,14,16],out=[];let i=3;for(let k=0;k<32;k++){if(r()<.32){out.push(null);continue}i=clamp(i+Math.round((r()-.5)*4),0,sc.length-1);out.push(sc[i])}return out}

function envG(t,peak,a,dec){const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);g.connect(musBus);return g}
function mKick(t){const o=actx.createOscillator();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);o.connect(envG(t,.75,.003,.22));o.start(t);o.stop(t+.3)}
function mNoise(t,v,hp,dec){const n=actx.createBufferSource();n.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;n.connect(f).connect(envG(t,v,.002,dec));n.start(t,Math.random()*.5);n.stop(t+dec+.05)}

const distCurve=(()=>{const n=1024,c=new Float32Array(n),k=5;for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c})();
function mGtr(t,m,d,v){const ws=actx.createWaveShaper();ws.curve=distCurve;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;ws.connect(f).connect(envG(t,.05*v,.004,d));
  [0,7,12].forEach(iv=>{const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m+iv);o.detune.value=(Math.random()-.5)*14;o.connect(ws);o.start(t);o.stop(t+d+.05)})}

function playStep(st,t,spb){if(!S.music)return;const bar=Math.floor(st/16),s=st%16,root=song.key+song.prog[bar%song.prog.length],f=song.feel;
  if(s===0||s===8||(f==='drive'&&s%4===0)||(f!=='soft'&&f!=='country'&&s===10))mKick(t);
  if(s===4||s===12)mNoise(t,f==='soft'?.14:.24,1400,.14);
  if(f==='surf'||s%2===0)mNoise(t,s%4===2?.06:.035,7500,.035);
  if(s%2===0)mBass(t,root+(f==='country'&&s%8===4?7:0)+(s===14?12:0),spb*1.8);
  if(f==='soft'){if(s%4===0)mClean(t,root+24+[0,4,7,12][(s/4)%4],spb*3.5)}
  else if(f==='country'){if(s%4===2)mGtr(t,root+12,spb*1.4,.7)}

function buildCarry(G){const st=CH.st,q=CH.q,box=q.box==='caixa',BA=-.5,BB=-6.2,w=L2W(st,BA,BB);CH.basket={x:w.x,z:w.z,items:[]};

function startAct(st,gen){CH={type:'act',st,gen,n:5,idx:0,first:0,coins:0};loadActQ()}
function loadActQ(){const st=CH.st;clearArena();CH.q=CH.gen(stat(st.id).level);CH.skill=lastSkill;buildAct();const w=L2W(st,-3,-2.8),f=L2W(st,5,0);teleport(w.x,w.z,f.x,f.z);pitch=CH.q.board?.3:.52;camLook=CH.q.board?4:1.7;

function nextAct(){if(!CH||CH.type!=='act')return;CH.idx++;if(CH.idx>=CH.n)return done3D();loadActQ()}
function actOK(ts){const q=CH.q;ts.forEach(t=>{t.mat.color.set('#22B35E');addMark(t,true)});okRound(null,q.explain,null,nextAct)}
function actReveal(){const q=CH.q,box=q.box==='caixa';if(q.verb==='carry')revealCarry();else{const sol=q.multi?q.sol:[q.ans];CH.targets.forEach(t=>{if(t.locked)return;if(sol.includes(t.i)){t.mat.color.set('#22B35E');addMark(t,true)}else if(q.multi){t.mat.color.set(t.base);if(t.painted)addMark(t,false)}})}

/* worked example: after the second miss the basket is refilled with a right answer, so the child sees it done */

function actCheck(){const q=CH.q;if(CH.locked)return;const sel=q.verb==='carry'?CH.basket.items.map(o=>o.v):CH.targets.filter(t=>t.painted).map(t=>t.i);

    if(CH.held.length&&isNear(CH.basket,2.5)){CH.held.forEach(o=>{o.state='basket';CH.basket.items.push(o)});CH.held=[];placeBasket();sfx.coin()}

function fire(){if(!CH||CH.type!=='shoot'||paused||CH.cool>0||CH.locked)return;CH.cool=.35;
  const dx=-Math.sin(yaw),dz=-Math.cos(yaw);let best=null,ba=.55;
  CH.balloons.forEach(b=>{if(!b.alive)return;const vx=b.x-P.x,vz=b.z-P.z,d=Math.hypot(vx,vz);if(d>34||d<.5)return;const a=Math.acos(clamp((vx*dx+vz*dz)/d,-1,1));if(a<ba){ba=a;best=b}});
  if(best)rotY=Math.atan2(best.x-P.x,best.z-P.z);else rotY=Math.atan2(dx,dz);
  const m=mesh(new THREE.SphereGeometry(.22,10,8),'#FFE45C',P.x+Math.sin(rotY)*.9,P.y+1.9,P.z+Math.cos(rotY)*.9,false);scene.add(m);

function updateShoot(dt){CH.cool-=dt;
  CH.balloons.forEach(b=>{if(b.alive){b.ph+=dt;b.sp.position.set(b.x+Math.sin(b.ph*.7)*.6,b.h+Math.sin(b.ph*1.3)*.35,b.z+Math.cos(b.ph*.5)*.6)}
    else if(b.pop<1){b.pop+=dt*4;const s=2.7*(1+b.pop*.8);b.sp.scale.set(s,s,1);b.sp.material.transparent=true;b.sp.material.opacity=Math.max(0,1-b.pop);if(b.pop>=1)b.sp.visible=false}});
  CH.shots=CH.shots.filter(s=>{s.life-=dt;
    if(s.t&&s.t.alive){const tp=s.t.sp.position,v=tmpV.set(tp.x-s.m.position.x,tp.y-s.m.position.y,tp.z-s.m.position.z),d=v.length();if(d<.7){drop(s.m);hitBalloon(s.t);return false}v.multiplyScalar(Math.min(d,30*dt)/d);s.m.position.add(v)}

  const nums=shuffle([...seq,...extra]),cubes=[],c={x:st.c.x+st.u.x*3,z:st.c.z+st.u.z*3},cols=['#E8413A','#2E8BF0','#2DB34A','#8B4CF0','#FF8A1F'];

function orderMission(){const c=CH,nx=c.seq[c.idx],prev=c.seq[c.idx-1];let t;
  if(c.L===1)t=`Pegue o número <b>${nx}</b>`;else if(c.idx===0)t=`Comece pelo <b>${nx}</b>!`;else if(c.desc)t=`Qual número vem <b>ANTES</b> do ${prev}?`;
  else if(c.step>1)t=`Conte de ${c.step} em ${c.step}: o que vem depois do <b>${prev}</b>?`;else t=`Qual número vem <b>DEPOIS</b> do ${prev}?`;

function updateOrder(dt){const c=CH;let touching=null;

function startShapes(st){const L=stat(st.id).level,qs=[];let prev=null;for(let i=0;i<6;i++){const q=genShapeQ(L,prev);prev=q.n;qs.push(q)}

function shapeAt(flatQ){let best=null,bd=1e9;for(const s of SHAPES){if(!!s.flat!==flatQ)continue;const d=Math.hypot(P.x-s.x,P.z-s.z);
  if((s.flat?(d<1.25&&onGround&&P.y<.5):(d<s.r+.95))&&d-(s.flat?0:s.r)<bd){best=s;bd=d-(s.flat?0:s.r)}}return best}
function updateShapes(){const c=CH,t=shapeAt(!!SHAPE_INFO[c.qs[c.idx].n].flat);

    playAnim('cheer');toast(`Isso! ${I.g==='a'?'Essa é a':'Esse é o'} <b>${t.n.toUpperCase()}</b> +${gain} 🪙`,2400);t.pulse=1;c.idx++;if(c.idx>=c.n)done3D();else setTimeout(()=>{if(CH===c)shapesMission()},1200)}

function parents(){const nm=esc(S.name||'Jogador'),pc=(f,n)=>n?`${f}/${n} (${Math.round(100*f/n)}%)`:'—',rows=STATIONS.map(s=>({s,t:stat(s.id)}));let arm=false,armDel=false,armIm=false;
  const sk=Object.keys(S.sk).map(id=>({id,k:S.sk[id],st:STM[id.split('.')[0]]})).filter(x=>x.st&&x.k.n>0).sort((a,b)=>a.k.r-b.k.r||b.k.n-a.k.n);
  const state=k=>k.n<3?['#C9CED6','Começando']:k.r>=.8&&!k.w?['#22B35E','Dominou']:k.r<.5?['#E53935','Precisa de ajuda']:['#FFC83D','Treinando'];
  const weak=sk.filter(x=>x.k.n>=3&&x.k.r<.5).slice(0,3),wks=[3,2,1,0].map(o=>weekKey(o)),any=wks.some(w=>S.wk[w]);
  openSheet(`<div class="pad"><div class="shop-h" style="padding:0 0 8px"><span class="h2">Progresso de ${nm}</span><button class="xbtn" id="p-x" aria-label="Fechar">✕</button></div>
    <p style="font-family:var(--fb);font-size:17px;line-height:1.45;margin:0">${weak.length?`Onde ${nm} mais precisa de ajuda agora: <b>${weak.map(x=>esc(skillName(x.id))).join('</b>, <b>')}</b>. Vale fazer junto, com objetos de verdade.`:sk.length?'Nenhuma habilidade em dificuldade no momento.':'Ainda não há respostas registradas.'}</p>
    <div class="sec">Por estação</div>
    <div class="tbl"><table><thead><tr><th>Capítulo</th><th>Estação</th><th>Nível</th><th>Rodadas</th><th>De primeira</th><th>Troféu</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.sub}</td><td>${r.s.name}</td><td>${r.t.level}/3</td><td>${r.t.rounds}</td><td>${pc(r.t.first,r.t.total)}</td><td>${['—','🥉','🥈','🏆'][S.trophies[r.s.id]||0]}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec">Semana a semana (acertos de primeira)</div>
    ${any?`<div class="tbl"><table><thead><tr><th>Estação</th>${wks.map((w,i)=>`<th>${i===3?'Esta semana':'Sem. de '+w.slice(8)+'/'+w.slice(5,7)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.name}</td>${wks.map(w=>{const a=(S.wk[w]||{})[r.s.id];return `<td>${a?pc(a[0],a[1]):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="small">Sem respostas nas últimas 4 semanas.</div>'}
    <div class="sec">Por habilidade</div>
    ${sk.length?`<div class="tbl"><table><thead><tr><th>Habilidade</th><th>Estação</th><th>De primeira</th><th>Situação</th></tr></thead><tbody>${sk.map(x=>{const [c,l]=state(x.k);return `<tr><td>${esc(skillName(x.id))}</td><td>${x.st.name}</td><td>${pc(x.k.f,x.k.n)}</td><td><span class="dot" style="background:${c}"></span>${l}${x.k.w?' · volta nas próximas rodadas':''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="small">Aparece aqui depois das primeiras respostas.</div>'}
    <p class="small" style="line-height:1.45">A situação pesa mais as respostas recentes. O que a criança erra volta nas rodadas seguintes, até acertar duas vezes de primeira. O nível sobe com 80% de acertos de primeira e desce abaixo de 40%. Estrelas: 3 com tudo certo de primeira (rodadas de 6 ou mais perguntas aceitam um erro), 2 com 60% e 1 com 30%. As moedas de bônus acompanham os acertos de primeira. A taça de ouro da estação sai com 3 estrelas no nível 3, e a Taça dos Campeões, com as 8 taças.</p>
    <div class="sec">Ajustes</div>
    <form id="nm" class="field"><input id="nm-in" maxlength="14" value="${esc(S.name)}" aria-label="Nome do jogador"><button class="btn gold">Salvar nome</button></form>
    <div class="field" style="margin-top:10px"><label for="p-br" style="font-family:var(--fb);font-size:17px">Aviso de pausa:</label><select id="p-br">${[0,15,20,30,45].map(m=>`<option value="${m}"${S.breakMin===m?' selected':''}>${m?`a cada ${m} minutos`:'desligado'}</option>`).join('')}</select></div>
    <div class="sec">Cópia de segurança</div>
    <div class="small" style="margin-bottom:8px">O progresso fica só neste aparelho. Salve uma cópia para não perder, ou para levar a outro aparelho.</div>
    <div class="btns" style="justify-content:flex-start"><button class="btn" id="p-ex">💾 Salvar cópia</button><button class="btn" id="p-im">📂 Restaurar cópia</button><input type="file" id="p-file" accept="application/json,.json" hidden></div>
    <div class="btns" style="justify-content:flex-start;margin-top:18px"><button class="btn" id="p-rs" style="background:var(--badbg)">Apagar progresso deste jogador</button>${PF.ids.length>1?'<button class="btn" id="p-del" style="background:var(--badbg)">Remover este jogador</button>':''}</div></div>`);
  $('#p-x').onclick=()=>closeSheet();
  $('#nm').onsubmit=e=>{e.preventDefault();const v=$('#nm-in').value.trim();if(v){S.name=v.slice(0,14);save();hud();buildPlayer();toast('Nome salvo!')}};
  $('#p-br').onchange=e=>{S.breakMin=+e.target.value;playT=0;save();toast(S.breakMin?`Aviso de pausa a cada ${S.breakMin} minutos.`:'Aviso de pausa desligado.')};
  $('#p-ex').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'ilha-dos-numeros',v:1,when:new Date().toISOString(),save:S})],{type:'application/json'}));
      a.download=`ilha-dos-numeros-${(S.name||'jogador').replace(/[^\wÀ-ɏ-]+/g,'_')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Cópia salva na pasta de downloads.')}catch(e){toast('Não consegui salvar a cópia neste aparelho.')}};
  $('#p-im').onclick=()=>{if(!armIm){armIm=true;$('#p-im').textContent='Toque de novo: substitui este jogador';return}$('#p-file').click()};
  $('#p-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onerror=()=>toast('Não consegui ler o arquivo.');
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!isObj(d)||d.app!=='ilha-dos-numeros'||!isObj(d.save)||!isObj(d.save.st))throw 0;S=normalize(d.save);S.tut=true;save();location.reload()}catch(_){toast('Esse arquivo não é uma cópia do jogo.')}};r.readAsText(f)};
  $('#p-rs').onclick=()=>{if(!arm){arm=true;$('#p-rs').textContent='Toque de novo para confirmar';return}S=normalize({name:S.name,tut:true,sound:S.sound,music:S.music,voice:S.voice,caps:S.caps,breakMin:S.breakMin});save();hud();buildPlayer();STATIONS.forEach(updateSign);updateHall();closeSheet();toast('Progresso apagado.')};
  if($('#p-del'))$('#p-del').onclick=()=>{if(!armDel){armDel=true;$('#p-del').textContent='Toque de novo para remover';return}try{localStorage.removeItem(KEY)}catch(e){}PF.ids=PF.ids.filter(i=>i!==PF.cur);PF.cur=PF.ids[0];savePF();location.reload()}}
/* optional reminder to take a break (set in the parents area); it waits for the current challenge to end */
let playT=0;
function breakCheck(dt){if(!S.breakMin)return;playT+=dt;if(playT<S.breakMin*60||CH||paused||pendFin)return;playT=0;
  openSheet(`<div class="result"><h2>Hora da pausa! 🧃</h2><p>Você já jogou ${S.breakMin} minutos. Que tal beber água, esticar o corpo e descansar os olhos?</p><div class="btns"><button class="btn go" id="br-ok">Voltei! ▶</button></div></div>`);
  $('#br-ok').onclick=()=>{sfx.tap();closeSheet()};speak('Hora da pausa! Que tal beber água e descansar os olhos?')}
$('#b-menu').onclick=()=>{sfx.tap();openMenu()};
$('#b-sound').onclick=()=>{S.sound=!S.sound;save();hud();sfx.tap();toast(S.sound?'Efeitos de som ligados 🔊':'Efeitos de som desligados',1500)};
$('#b-music').onclick=()=>{S.music=!S.music;save();hud();ensureAudio();musicOn(S.music);toast(S.music?'Música ligada 🎸':'Música desligada',1500)};
$('#b-voice').onclick=()=>{S.voice=!S.voice;save();hud();if(!S.voice)try{speechSynthesis.cancel()}catch(e){}toast(S.voice?'A voz vai ler as perguntas 🗣️':'Voz desligada',1800,S.voice)};

/* ================= LOOP ================= */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();layoutTop()}
addEventListener('resize',resize);
let last=performance.now(),qN=0,qT=0,autoQual=true;
function tick(now){requestAnimationFrame(tick);const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;
  /* every 2.5 seconds of play: under 27 frames per second, step the picture quality down once (a long gap, such as a tab switch, restarts the count) */
  if(autoQual&&QUAL>0&&!document.hidden){if(raw>1){qN=0;qT=0}else{qT+=raw;qN++;if(qT>=2.5){if(T>3&&qN/qT<27)setQuality(QUAL-1);qN=0;qT=0}}}
  updatePlayer(dt);updatePet(dt);updateWorld(dt);update3D(dt);updatePortals(dt);updateFx(dt);updateCam(dt);updateNear();breakCheck(dt);renderer.render(scene,camera)}
function boot(){if(S.lite)setQuality(0);resize();buildPlayer();hud();STATIONS.forEach(updateSign);updateHall();camera.position.set(P.x,P.y+5,P.z+10);requestAnimationFrame(tick);if(!S.tut)openTut()}
window.__ilhaDebug={set timeScale(v){TS=v},get onGround(){return onGround},scene,input,get QUAL(){return QUAL},setQuality,set autoQual(v){autoQual=v},renderer,PLATS,SHAPES,lastSkill:()=>lastSkill,record,starsFor,flushFin,breakCheck,get keys(){return keys},get camRot(){return camRot},get pendFin(){return pendFin},get PF(){return PF},get CH(){return CH},get standing(){return standing},get yaw(){return yaw},set yaw(v){yaw=v},get WORLD(){return WORLD},P,L2W,STM,FRIENDS,HALL,PORTALS,
  step:dt=>{updatePlayer(dt);update3D(dt);updatePortals(dt);updateNear()},startMode,enterWorld,leaveWorld,fire,closeSheet,playAnim,get ANIM(){return ANIM},audio:()=>({state:actx&&actx.state,step:mStep,bpm:song.bpm,parts:PARTS.length}),jump:()=>{input.jump=true},checkTrophies,S:()=>S};
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 40px Fredoka'),document.fonts.load('400 20px Andika')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1800))]).then(()=>{OBBY.boards.forEach((b,k)=>drawBoard(k,'? + ?',false));boot()}).catch(boot);
})();
